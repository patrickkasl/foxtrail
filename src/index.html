<style>

  body.still #hud, body.still #doing, body.still #title, body.still .fox-label, body.still .fox-bubble { opacity: 0 !important; }
  #comfort { position: fixed; left: 18px; bottom: 70px; display: none; z-index: 5; }

  @keyframes breathe { 0%, 100% { opacity: 0.55 } 50% { opacity: 1 } }
  @keyframes flow { to { stroke-dashoffset: -20 } }
  #welcome .choices { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #welcome .quiet { background: none; color: #57524a; text-decoration: underline; text-underline-offset: 3px; padding: 9px 6px; }
  #comfort { bottom: 70px; }
  #greeting { position: fixed; inset: 34% 16px auto; text-align: center; pointer-events: none; opacity: 0; transition: opacity 2.8s ease; z-index: 2;
    font: italic 500 clamp(30px, 4.6vw, 60px) 'Cormorant Garamond', serif; color: #fff; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.45); }
  #greeting.show { opacity: 1; }

  #journal .close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd5c6; background: rgba(255, 255, 255, 0.6);
    color: #6b665e; font-size: 20px; line-height: 1; cursor: pointer; }
  #journal .close:hover { background: #fff; color: #2c2a26; }
  #offline { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 12px; opacity: 0; transition: opacity 1s; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }

<body>
<div id="title"></div>
<div id="hud"></div>
<div id="doing"></div>
<div id="card"></div>
<div id="offline">No connection to Claude Code: the fox wanders on its own.</div>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js'

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k) }
function hash(n) { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296 }
function rng(seed) { let s = seed | 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296 } }
const V = (r, g, b) => new THREE.Vector3(r, g, b)
const hex = h => { const c = new THREE.Color(h); return V(c.r, c.g, c.b) }

/** The trail the fox walks on. The shader uses the very same formula, so the fox stands on the rendered ground. */
const pathY = x => 0.9 * Math.sin(x * 0.05) + 0.5 * Math.sin(x * 0.13 + 1.3) + 0.25 * Math.sin(x * 0.31 + 0.7)
const groundY = x => pathY(x) - 0.3

const today = new Date().toISOString().slice(0, 10)
const saved = (() => { try { return JSON.parse(localStorage.getItem('foxtrail') || '{}') } catch { return {} } })()
const daySeed = Math.floor(hash(today.split('-').reduce((a, b) => a * 31 + Number(b), 7)) * 1e6)
const DEBUG = new URLSearchParams(location.search).has('debug')
const debug = DEBUG ? (window.__fox = {}) : {}
const jump = DEBUG ? Number(new URLSearchParams(location.search).get('x')) : 0
let cairnsToday = saved.day === today ? saved.cairns || 0 : 0

// mode: 0 earth, 1 cave, 2 space, 3 underwater, 4 dreamy
const W = (o) => o
const BIOMES = [
  W({ realm: 'earth', name: 'Alpine Meadow', mode: 0, top: '#3f78c4', low: '#bcd6ec', fog: '#b9cde0', sun: '#fff1d6', grass: '#5f9a3e', rock: '#7c766e', snow: 0.62, amp: 1.0, water: -9, waterCol: '#2d5f7a', density: 0.010 }),
  W({ realm: 'earth', name: 'The Mountain Lake', mode: 0, top: '#4a82cc', low: '#cfe0ee', fog: '#c4d5e4', sun: '#fff4dc', grass: '#6a9e46', rock: '#837d75', snow: 0.55, amp: 1.15, water: -0.9, waterCol: '#24577a', density: 0.009 }),
  W({ realm: 'earth', name: 'Singing Dunes', mode: 0, top: '#d0844f', low: '#f6d2a0', fog: '#f0c995', sun: '#ffe1b0', grass: '#d8a868', rock: '#c48a56', snow: 2, amp: 0.45, water: -9, waterCol: '#2d5f7a', density: 0.012 }),
  W({ realm: 'earth', name: 'The Snowy Pass', mode: 0, top: '#6e8fbf', low: '#e2e9f2', fog: '#dbe3ee', sun: '#ffffff', grass: '#e9eef5', rock: '#8a8f99', snow: 0.12, amp: 1.25, water: -9, waterCol: '#2d5f7a', density: 0.016 }),
  W({ realm: 'earth', name: 'Autumn Valley', mode: 0, top: '#b9784f', low: '#f2cfa6', fog: '#e8c19c', sun: '#ffd8a0', grass: '#b8692c', rock: '#7a6a5e', snow: 0.8, amp: 0.8, water: -1.4, waterCol: '#3a5a6a', density: 0.014 }),
  W({ realm: 'earth', name: 'Green Hills', mode: 0, top: '#5d97d8', low: '#e3eef4', fog: '#d3e2ea', sun: '#fff3dc', grass: '#6fae4a', rock: '#8a8479', snow: 2, amp: 0.4, water: -1.2, waterCol: '#2f6a80', density: 0.008 }),
  W({ realm: 'underground', name: 'The Crystal Cave', mode: 1, top: '#05050f', low: '#120f28', fog: '#141032', sun: '#6a6cff', grass: '#3a3566', rock: '#2a2648', snow: 2, amp: 0.6, water: -9, waterCol: '#1c3a6a', density: 0.05, glow: '#7fe6ff' }),
  W({ realm: 'underground', name: 'Cave of Glowing Fungi', mode: 1, top: '#030c0a', low: '#0a221d', fog: '#0b2a24', sun: '#3affc4', grass: '#1f5a4c', rock: '#163a32', snow: 2, amp: 0.5, water: -9, waterCol: '#1c3a6a', density: 0.05, glow: '#5dffc8' }),
  W({ realm: 'underground', name: 'The Underground Lake', mode: 1, top: '#02060f', low: '#081a32', fog: '#0a1e3a', sun: '#5a8cff', grass: '#2a3e5a', rock: '#1e2c42', snow: 2, amp: 0.45, water: -0.6, waterCol: '#123a6a', density: 0.04, glow: '#8fb6ff' }),
  W({ realm: 'space', name: 'The Moon Plain', mode: 2, top: '#000005', low: '#05070f', fog: '#05070f', sun: '#ffffff', grass: '#8d8f96', rock: '#6a6c74', snow: 2, amp: 0.7, water: -9, waterCol: '#000000', density: 0.0015, planet: '#5b8ad8', ring: 0 }),
  W({ realm: 'space', name: 'Beneath the Ringed Planet', mode: 2, top: '#02010a', low: '#120a22', fog: '#0c0618', sun: '#ffe9d0', grass: '#8a6a9e', rock: '#5e4870', snow: 2, amp: 0.9, water: -9, waterCol: '#000000', density: 0.0025, planet: '#d8a066', ring: 1 }),
  W({ realm: 'space', name: 'Inside the Nebula', mode: 2, top: '#0c0320', low: '#4a1650', fog: '#3a1248', sun: '#ffd0f0', grass: '#6e4a86', rock: '#4a2e5e', snow: 2, amp: 0.8, water: -9, waterCol: '#000000', density: 0.006, planet: '#9a6ae0', ring: 1, nebula: 1 }),
  W({ realm: 'fantasy', name: 'Beneath the Waves', mode: 3, top: '#06405e', low: '#1f86a6', fog: '#1a7896', sun: '#c8f4ff', grass: '#d8c690', rock: '#7a8a7e', snow: 2, amp: 0.6, water: -9, waterCol: '#000000', density: 0.035 }),
  W({ realm: 'fantasy', name: 'Pink Cloudland', mode: 4, top: '#8fb2ee', low: '#ffdbe6', fog: '#ffe3ec', sun: '#fff0f4', grass: '#f6eef4', rock: '#e2cfe6', snow: 2, amp: 0.7, water: -9, waterCol: '#000000', density: 0.012 }),
  W({ realm: 'fantasy', name: 'The Enchanted Wood', mode: 4, top: '#3a2a6e', low: '#d6a8d8', fog: '#c49ed0', sun: '#ffe0f8', grass: '#6a4aa0', rock: '#4a3a6a', snow: 2, amp: 0.8, water: -1.0, waterCol: '#5a3a8a', density: 0.016, glow: '#ff9ef0' }),
]
const BY_REALM = BIOMES.reduce((m, b) => ((m[b.realm] ||= []).push(b), m), {})

const SUBS = { earth: 'Earth', underground: 'Underground', space: 'Space', fantasy: 'Fantasy' }


// ---------- generated worlds ----------
const hsl = (h, sat, l) => '#' + new THREE.Color().setHSL(((h % 360) + 360) % 360 / 360, clamp(sat), clamp(l)).getHexString()
const pick = (r, list) => list[Math.floor(r() * list.length)]
const between = (r, a, b) => a + r() * (b - a)

/** A colour word for a hue, for the generated names. */
function hueWord(h, light) {
  h = ((h % 360) + 360) % 360
  if (light > 0.8) return 'Pearl'
  if (h < 15 || h >= 345) return 'Ruby'
  if (h < 40) return 'Amber'
  if (h < 60) return 'Gold'
  if (h < 90) return 'Moss'
  if (h < 160) return 'Jade'
  if (h < 190) return 'Turquoise'
  if (h < 230) return 'Cobalt'
  if (h < 265) return 'Indigo'
  if (h < 300) return 'Violet'
  return 'Rose'
}

const MOODS = ['Quiet', 'Distant', 'Whispering', 'Sleeping', 'Forgotten', 'High', 'Deep', 'Golden', 'Soft', 'Wide', 'Lonely', 'Hidden', 'Old', 'Dreaming']
const NOUNS = {
  earth: { hills: ['Hills', 'Valley', 'Plain', 'Highlands'], peaks: ['Mountains', 'Pass', 'Peaks', 'Range'], water: ['Lakes', 'Shores', 'Lakelands'], sand: ['Dunes', 'Desert'], snow: ['Snowfields', 'Ice Pass', 'Glaciers'] },
  underground: { any: ['Cave', 'Vaults', 'Depths', 'Crystal Halls', 'Tunnels'] },
  space: { any: ['Moon', 'Planet', 'Plain', 'Craters', 'Nebula'] },
  fantasy: { any: ['Dreamland', 'Cloud Realm', 'Gardens', 'Faerie Land'], sea: ['Sea', 'Deep Sea', 'Coral Realm'] },
}

function worldName(r, realm, kind, hue, light) {
  const pool = NOUNS[realm][kind] || NOUNS[realm].any
  const noun = pick(r, pool)
  const compound = kind !== 'snow' && r() < 0.6
  const word = compound ? `${hueWord(hue, light)} ${noun}` : noun
  const moods = MOODS.filter(m => !word.toLowerCase().includes(m.slice(0, 4).toLowerCase()) && !(compound && m === 'Golden'))
  return `The ${pick(r, moods)} ${word}`
}

function generateBiome(r, realm) {
  if (realm === 'earth') {
    const warm = r() < 0.22
    const kind = r() < 0.18 ? 'sand' : r() < 0.18 ? 'snow' : r() < 0.35 ? 'water' : r() < 0.5 ? 'peaks' : 'hills'
    const skyH = warm ? between(r, 12, 38) : between(r, 196, 228)
    const grassH = kind === 'sand' ? between(r, 26, 42) : kind === 'snow' ? between(r, 200, 220) : between(r, 62, 128)
    const grass = kind === 'sand' ? hsl(grassH, between(r, 0.45, 0.6), between(r, 0.55, 0.65)) : kind === 'snow' ? hsl(grassH, 0.15, 0.92) : hsl(grassH, between(r, 0.35, 0.55), between(r, 0.32, 0.45))
    const low = hsl(skyH + (warm ? 10 : -10), warm ? 0.75 : 0.45, warm ? 0.78 : 0.84)
    return {
      realm, mode: 0, name: worldName(r, realm, kind, kind === 'sand' || kind === 'hills' ? grassH : skyH, 0.5),
      top: hsl(skyH, warm ? 0.5 : 0.6, warm ? 0.55 : 0.5), low, fog: low,
      sun: warm ? hsl(32, 1, 0.82) : hsl(45, 1, 0.92), grass, rock: hsl(between(r, 20, 40), between(r, 0.05, 0.15), between(r, 0.38, 0.5)),
      snow: kind === 'snow' ? 0.1 : kind === 'peaks' ? between(r, 0.45, 0.65) : r() < 0.4 ? between(r, 0.55, 0.75) : 2,
      amp: kind === 'peaks' || kind === 'snow' ? between(r, 1.0, 1.35) : kind === 'sand' ? between(r, 0.35, 0.6) : between(r, 0.45, 0.9),
      ridge: kind === 'sand' ? 0 : kind === 'hills' ? between(r, 0, 0.5) : between(r, 0.7, 1), freq: between(r, 0.8, 1.4),
      water: kind === 'water' ? between(r, -0.9, -0.2) : r() < 0.15 ? -0.8 : -9, waterCol: hsl(between(r, 190, 210), 0.5, 0.3), density: between(r, 0.004, 0.009),
    }
  }
  if (realm === 'underground') {
    const h = between(r, 0, 360)

  },

const POSE_ORDER = Object.keys(POSES.sit)
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion()
const poseCache = {}

/** Turns each listed bone so its child lies along the wanted direction, then blends the result in by weight. */
function applyPose(m, name, weight) {
  if (weight <= 0.001) return
  const pose = POSES[name]
  const bones = m.real.bones
  const anim = {}
  for (const k of POSE_ORDER) anim[k] = bones[k].quaternion.clone()
  const frame = m.group.getWorldQuaternion(new THREE.Quaternion())
  for (const k of POSE_ORDER) {
    const b = bones[k]
    const child = b.children.find(c => c.isBone)
    if (!child) continue
    b.updateWorldMatrix(true, true)
    const from = child.getWorldPosition(_v2).sub(b.getWorldPosition(_v1)).normalize()
    const [dx, dy] = pose[k]
    const to = new THREE.Vector3(dx, dy, 0).normalize().applyQuaternion(frame)
    const delta = _q1.setFromUnitVectors(from, to)
    const world = b.getWorldQuaternion(_q2)
    const parentInv = b.parent.getWorldQuaternion(_q3).invert()
    b.quaternion.copy(parentInv.multiply(delta.multiply(world)))
  }
  for (const k of POSE_ORDER) {
    const target = bones[k].quaternion.clone()
    bones[k].quaternion.copy(anim[k]).slerp(target, weight)
  }
  m.real.model.updateMatrixWorld(true)
}

/** How far the lowest paw of a fox is above or below the ground right now. */
function pawClearance(m) {
  let low = Infinity
  for (const k of ['b_LeftFoot02_018', 'b_RightFoot02_022', 'b_LeftHand_011', 'b_RightHand_08', 'b_Tail02_013']) {
    low = Math.min(low, m.real.bones[k].getWorldPosition(_v1).y)
  }
  return low - groundY(m.group.position.x)
}

function playFox(m, name, fade = 0.5) {
  const next = m.real.actions[name]
  if (!next || m.real.current === next) return
  next.reset().fadeIn(fade).play()
  if (m.real.current) m.real.current.fadeOut(fade)
  m.real.current = next
}

/** Fur colours for the pack: how much of the original colour stays, the tint, and a lift for the pale ones. */
const COATS = [
  { name: 'Red fox', gray: 0, tint: [1, 1, 1], lift: 0 },
  { name: 'Arctic fox', gray: 1, tint: [1.45, 1.45, 1.5], lift: 0.18 },

  { name: 'Desert fox', gray: 0.65, tint: [1.3, 1.08, 0.74], lift: 0.06 },
  { name: 'Ember fox', gray: 0, tint: [1.2, 0.62, 0.5], lift: 0 },
]
const savedCoats = (() => { try { return JSON.parse(localStorage.getItem('foxtrail-coats') || '{}') } catch { return {} } })()

/** A free coat for a session: the one it had before, else its own preference, else the first nobody wears. */
function pickCoat(id) {
  const taken = new Set([...members.values()].filter(m => !m.leftAt).map(m => m.coat))
  if (savedCoats[id] !== undefined && !taken.has(savedCoats[id])) return savedCoats[id]
  for (let c = 0; c < COATS.length; c++) if (!taken.has(c)) return c
  return Math.floor(hash(id.length * 977 + members.size) * COATS.length)
}

/** Gives each mesh of a cloned fox its own material, recoloured in the shader so even white and black work. */
function dressFox(model, coat, lighter = 0) {
  const c = COATS[coat] || COATS[0]
  model.traverse(o => {
    if (!o.isMesh || !o.material) return
    const mat = o.material.clone()
    mat.roughness = 0.85
    mat.metalness = 0
    mat.onBeforeCompile = shader => {
      shader.uniforms.uGray = { value: c.gray }
      shader.uniforms.uTint = { value: new THREE.Vector3(...c.tint) }
      shader.uniforms.uLift = { value: c.lift + lighter }
      shader.fragmentShader = 'uniform float uGray; uniform vec3 uTint; uniform float uLift;\n' + shader.fragmentShader.replace(
        '#include <map_fragment>',
        '#include <map_fragment>\n  float foxLum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));\n  diffuseColor.rgb = clamp(mix(diffuseColor.rgb, vec3(foxLum), uGray) * uTint + uLift, 0.0, 1.0);',
      )
    }
    mat.customProgramCacheKey = () => 'fox-coat'
    o.material = mat
    o.frustumCulled = false
  })
}

/** Clones the loaded fox, with its own skeleton and animations, into a pack member. */
function giveModel(m) {
  if (!foxAsset || m.real.model) return
  const model = SkeletonUtils.clone(foxAsset.scene)
  const box = new THREE.Box3().setFromObject(model)
  const size = box.getSize(new THREE.Vector3())
  model.scale.setScalar(1.45 / Math.max(size.x, size.z))
  if (size.z > size.x) model.rotation.y = Math.PI / 2
  dressFox(model, m.coat)
  m.real.model = model
  m.real.bones = {}
  model.traverse(o => { if (o.isBone) m.real.bones[o.name] = o })
  m.real.mixer = new THREE.AnimationMixer(model)
  for (const clip of foxAsset.animations) m.real.actions[clip.name] = m.real.mixer.clipAction(clip)
  m.fallback.visible = false
  m.group.add(model)
  enterFromLeft(m)
  playFox(m, 'Run')
}

/** Puts a fox just beyond the left edge of the view, so it runs in and catches up with its place in the pack. */
function enterFromLeft(m) {
  const depth = camera.position.z - m.group.position.z
  const half = depth * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect
  const x = camera.position.x - half - 1.5 - (m.slot || 0) * 1.3
  m.group.position.x = Math.min(m.group.position.x, x)
  m.baseY = groundY(x)
  m.v = 3.5
}

// ---------- the height of the rendered land, asked of the GPU ----------
const PROBE_N = 16
const probeTarget = new THREE.WebGLRenderTarget(PROBE_N, 1, { type: THREE.FloatType })
const probePts = Array.from({ length: PROBE_N }, () => new THREE.Vector2())
const probeOut = new Float32Array(PROBE_N * 4)
const probeScene = new THREE.Scene()
probeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { ...uniforms, uPts: { value: probePts } }, depthWrite: false, depthTest: false,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: LAND_SHADER.slice(0, LAND_SHADER.indexOf('float fogAmtPre')).replace('varying vec2 vUv;', '') +
    'uniform vec2 uPts[16]; void main(){ int i = int(gl_FragCoord.x); vec2 p = uPts[0]; for (int k = 0; k < 16; k++) { if (k == i) p = uPts[k]; } gl_FragColor = vec4(terrain(p, 0.0), 0., 0., 1.); }',
})))
/** Heights of the land at up to 16 (x, z) points, or null when the GPU cannot read back floats. */
function landHeights(points) {
  points.forEach((p, i) => probePts[i].set(p[0], p[1]))
  try {
    renderer.setRenderTarget(probeTarget)
    renderer.render(probeScene, landCam)
    renderer.readRenderTargetPixels(probeTarget, 0, 0, PROBE_N, 1, probeOut)
    renderer.setRenderTarget(null)
    return points.map((_, i) => probeOut[i * 4])
  } catch {
    renderer.setRenderTarget(null)
    return null
  }
}

// ---------- weather ----------
const WEATHER_WORDS = { clear: '', cloudy: 'cloudy', rain: 'rain', storm: 'thunderstorm', fog: 'fog', snow: 'snow', sandstorm: 'sandstorm', aurora: 'aurora', petals: 'falling blossom', drips: 'dripping', spores: 'spores', meteors: 'meteor shower', bubbles: 'currents' }
function weatherOptions(b, night) {
  if (b.mode === 1) return [['clear', 3], ['drips', 3], ['spores', 2]]
  if (b.mode === 2) return [['clear', 3], ['meteors', 2]]
  if (b.mode === 3) return [['bubbles', 1]]
  if (b.mode === 4) return [['clear', 4], ['petals', 3], ['fog', 1], ['cloudy', 1]]
  const cold = b.snow < 0.3 || (b.grass && hex(b.grass).x > 0.85)
  const sand = !b.snow || b.snow > 1 ? b.ridge === 0 || /Duinen|woestijn/i.test(b.name) : false
  const list = [['clear', 4], ['cloudy', 3], ['fog', 1.2]]
  if (cold) list.push(['snow', 3])
  else list.push(['rain', 1.8], ['storm', 0.7])
  if (sand) list.push(['sandstorm', 1.5])
  if (night && (cold || b.snow < 0.8)) list.push(['aurora', 2])
  return list
}
const weather = { kind: 'clear', next: 'clear', mix: 1, until: 0, realm: '' }
function rollWeather(b, t, night) {
  const options = weatherOptions(b, night)
  const total = options.reduce((n, [, w]) => n + w, 0)
  let pickAt = Math.random() * total
  let kind = options[0][0]
  for (const [k, w] of options) { if ((pickAt -= w) <= 0) { kind = k; break } }
  if (kind !== weather.kind) { weather.next = kind; weather.mix = 0 }
  weather.until = t + 120 + Math.random() * 180
}

/** One cloud of particles around the camera, drawn as points or short streaks. */
function particleSystem(count, lines) {
  const pos = new Float32Array(count * (lines ? 6 : 3))
  const geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3))
  const mat = lines
    ? new THREE.LineBasicMaterial({ color: 0xbcd0e6, transparent: true, opacity: 0, depthWrite: false })
    : new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0, depthWrite: false })
  const obj = lines ? new THREE.LineSegments(geo, mat) : new THREE.Points(geo, mat)
  obj.frustumCulled = false
  const seeds = Array.from({ length: count }, () => [Math.random(), Math.random(), Math.random(), Math.random()])
  scene.add(obj)
  return { obj, pos, geo, mat, seeds, count, lines }
}
const rain = particleSystem(900, true)
const flakes = particleSystem(900, false)
const glows = particleSystem(160, false)
glows.mat.blending = THREE.AdditiveBlending
glows.mat.size = 0.12
const meteors = particleSystem(5, true)
meteors.mat.vertexColors = true
meteors.mat.blending = THREE.AdditiveBlending
meteors.geo.setAttribute('color', new THREE.Float32BufferAttribute(Array.from({ length: 5 }, () => [1, 1, 1, 0, 0, 0]).flat(), 3))

function updateParticles(t, dt, kind, w, night) {
  const cx = camera.position.x
  const span = 34
  const wrap = (v, lo, size) => lo + ((((v - lo) % size) + size) % size)
  // rain and drips
  const raining = kind === 'rain' || kind === 'storm' || kind === 'drips'
  rain.mat.opacity = lerp(rain.mat.opacity, raining ? (kind === 'drips' ? 0.35 : 0.5) * w : 0, 0.05)
  if (rain.mat.opacity > 0.01) {
    const n = kind === 'drips' ? 120 : kind === 'storm' ? 900 : 600
    const slant = kind === 'storm' ? 0.35 : kind === 'drips' ? 0 : 0.12
    for (let i = 0; i < rain.count; i++) {
      const [a, b, c] = rain.seeds[i]
      const o = i * 6
      if (i >= n) { rain.pos.fill(0, o, o + 6); continue }
      const y = wrap(14 - (t * (kind === 'drips' ? 4 : 16) * (0.8 + c * 0.4) + b * 14), -2, 16) + groundY(cx)
      const x = wrap(cx - span / 2 + a * span + y * slant, cx - span / 2, span)
      const z = -10 + c * 15
      const len = kind === 'drips' ? 0.25 : 0.45
      rain.pos.set([x, y, z, x - slant * len, y + len, z], o)
    }
    rain.geo.attributes.position.needsUpdate = true
  }
  // snow, petals, sandstorm dust, bubbles
  const flaking = kind === 'snow' || kind === 'petals' || kind === 'sandstorm' || kind === 'bubbles'
  flakes.mat.opacity = lerp(flakes.mat.opacity, flaking ? 0.85 * w : 0, 0.05)
  if (flakes.mat.opacity > 0.01) {
    flakes.mat.color.set(kind === 'petals' ? 0xffb8d6 : kind === 'sandstorm' ? 0xe8c08a : kind === 'bubbles' ? 0xd8f6ff : 0xffffff)
    flakes.mat.size = kind === 'sandstorm' ? 0.05 : kind === 'bubbles' ? 0.09 : 0.08
    for (let i = 0; i < flakes.count; i++) {
      const [a, b, c, d] = flakes.seeds[i]
      let x, y
      if (kind === 'sandstorm') {
        x = wrap(cx - span / 2 + a * span - t * (9 + c * 6), cx - span / 2, span)
        y = groundY(cx) + b * 5 + Math.sin(t * 2 + d * 20) * 0.2
      } else {
        const fall = kind === 'bubbles' ? -1.2 : kind === 'petals' ? 0.9 : 1.1
        y = wrap(12 - (t * fall * (0.6 + c * 0.6) + b * 14), -2, 16) + groundY(cx)
        x = wrap(cx - span / 2 + a * span + Math.sin(t * 0.8 + d * 30) * 0.6 + (kind === 'petals' ? t * 0.6 : 0), cx - span / 2, span)
      }
      flakes.pos.set([x, y, -10 + d * 15], i * 3)
    }
    flakes.geo.attributes.position.needsUpdate = true
  }
  // fireflies at night, spores in caves
  const glowing = kind === 'spores' || (night > 0.5 && !raining && kind !== 'snow' && weather.biomeMode !== 2)
  glows.mat.opacity = lerp(glows.mat.opacity, glowing ? 1 : 0, 0.03)
  if (glows.mat.opacity > 0.01) {
    glows.mat.color.set(kind === 'spores' ? weather.glow || 0x7dffd8 : 0xd6ff7a)
    for (let i = 0; i < glows.count; i++) {
      const [a, b, c, d] = glows.seeds[i]
      const x = wrap(cx - span / 2 + a * span + Math.sin(t * 0.3 + d * 40) * 1.2, cx - span / 2, span)
      const blink = kind === 'spores' ? 1 : Math.max(0, Math.sin(t * (1 + c) + d * 50)) ** 3
      const y = groundY(x) + 0.3 + b * (kind === 'spores' ? 6 : 2.2) + Math.sin(t * 0.7 + c * 20) * 0.3 + (kind === 'spores' ? (t * 0.2 * (0.5 + c)) % 6 : 0)
      glows.pos.set([x, blink > 0.05 ? y : -999, -7 + c * 9], i * 3)
    }
    glows.geo.attributes.position.needsUpdate = true
  }
  // meteors
  meteors.mat.opacity = lerp(meteors.mat.opacity, kind === 'meteors' ? 0.9 : 0, 0.05)
  if (meteors.mat.opacity > 0.01) {
    for (let i = 0; i < meteors.count; i++) {
      const [a, b, c] = meteors.seeds[i]
      const cycle = (t * 0.22 + a * 7) % 5
      const p = cycle / 0.9
      const sx = cx - 40 + b * 80 + p * 30
      const sy = 30 + c * 20 - p * 14
      const fade = Math.sin(Math.min(1, p) * Math.PI)
      meteors.geo.attributes.color.setXYZ(i * 2, fade, fade, fade)
      meteors.pos.set(p < 1 ? [sx, sy, -80, sx - 1.6, sy + 0.75, -80] : [0, -999, 0, 0, -999, 0], i * 6)
    }
    meteors.geo.attributes.position.needsUpdate = true
    meteors.geo.attributes.color.needsUpdate = true
  }
}

let flashLeft = 0
function updateWeather(t, dt, b, night) {
  if (weather.realm !== b.realm + b.name) { weather.realm = b.realm + b.name; weather.biomeMode = b.mode; weather.glow = b.glow; rollWeather(b, t, night) }
  if (t > weather.until) rollWeather(b, t, night)
  weather.mix = Math.min(1, weather.mix + dt / 12)
  if (weather.mix >= 1) weather.kind = weather.next
  const k = weather.mix
  const target = kind => ({
    cloud: { cloudy: 0.6, rain: 0.85, storm: 1, fog: 0.5, snow: 0.7, sandstorm: 0.4 }[kind] || 0,
    fogB: { fog: 0.8, rain: 0.12, storm: 0.18, snow: 0.2, sandstorm: 0.9 }[kind] || 0,
    wet: { rain: 1, storm: 1 }[kind] || 0,
    aurora: kind === 'aurora' ? 1 : 0,
  })
  const a = target(weather.kind), c = target(weather.next)
  uniforms.uCloud.value = lerp(a.cloud, c.cloud, k)
  uniforms.uFogBoost.value = lerp(a.fogB, c.fogB, k)
  uniforms.uWet.value = lerp(uniforms.uWet.value, lerp(a.wet, c.wet, k), 0.01)
  uniforms.uAurora.value = lerp(a.aurora, c.aurora, k) * night
  const storming = (weather.next === 'storm' ? k : 0) + (weather.kind === 'storm' && weather.next === 'storm' ? 0 : 0)
  if (flashLeft > 0) flashLeft -= dt
  else if (storming > 0.5 && Math.random() < dt * 0.12) flashLeft = 0.25
  uniforms.uFlash.value = flashLeft > 0 ? (Math.sin(flashLeft * 60) > 0 ? 1 : 0.3) * storming : 0
  const shown = k < 0.5 ? weather.kind : weather.next
  const w = shown === weather.next ? k : 1 - k
  updateParticles(t, dt, shown, Math.max(0.2, w), night)
  return shown
}

const silMat = () => new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, fog: false, depthWrite: false, transparent: true })

/** A shape from SVG-like commands (M, L, C, Q, Z, absolute, y up). */
function shapeFrom(d) {
  const tokens = d.match(/[MLCQZ]|-?\d*\.?\d+/g)
  const s = new THREE.Shape()
  let i = 0
  const n = () => Number(tokens[i++])
  while (i < tokens.length) {
    const c = tokens[i++]
    if (c === 'M') s.moveTo(n(), n())
    else if (c === 'L') s.lineTo(n(), n())
    else if (c === 'Q') s.quadraticCurveTo(n(), n(), n(), n())
    else if (c === 'C') s.bezierCurveTo(n(), n(), n(), n(), n(), n())
    else if (c === 'Z') s.closePath()
  }
  return s
}
const part = (d, mat, x = 0, y = 0) => { const m = new THREE.Mesh(new THREE.ShapeGeometry(shapeFrom(d), 14), mat); m.position.set(x, y, 0); return m }
const pivot = (parent, x, y, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g }

/** A flier in profile: body plus two wings in two parts each, the outer part lagging behind for a soft whip. */
function makeFlier(kind = 'bird', size = 1) {
  const W = WINGS[kind]
  const g = new THREE.Group()
  const mat = silMat()
  const wings = []
  for (const [z, s] of [[-0.01, 0.92], [0.01, 1]]) {
    const sh = pivot(g, W.shoulder[0], W.shoulder[1], z)
    sh.scale.setScalar(s)
    sh.add(part(W.inner, mat))
    const wr = pivot(sh, W.wrist[0], W.wrist[1])
    wr.add(part(W.outer, mat))
    wings.push({ sh, wr })
  }
  g.add(part(W.body, mat))
  g.userData = { mat, wings, phase: Math.random() * 6, kind }
  g.scale.setScalar(size)
  return g
}

/** One beat of the wings: up, through the level edge-on moment, and down; gliders hold them nearly level. */
function flap(bird, t, rate = 9, glide = 0) {
  const u = bird.userData
  const ph = t * rate + u.phase
  const beat = glide > 0 ? 0.55 + 0.1 * Math.sin(ph) : 0.5 - 0.5 * Math.sin(ph)
  const base = lerp(0.15, 2.5, beat)
  const lag = glide > 0 ? 0.05 * Math.sin(ph - 0.8) : 0.45 * Math.sin(ph - 1.1)
  for (const w of u.wings) {
    w.sh.rotation.x = base
    w.wr.rotation.x = lag
  }
}

/** Gives a cloned model its own materials that fade into the same haze as the land behind it. */
function hazeMaterials(model, spec) {
  const haze = { uHaze: { value: 0 }, uHazeCol: { value: new THREE.Color() }, uMoon: { value: 0 } }
  const mats = []
  model.traverse(o => {
    if (!o.isMesh || !o.material) return
    o.frustumCulled = false
    const m = o.material.clone()
    m.metalness = 0
    m.roughness = 0.9
    const eye = /eye/i.test(m.name)
    if (spec.tint && !eye) m.color.set(spec.tint)
    if (spec.glow && !eye) { m.emissive = m.color.clone().multiplyScalar(spec.glow); m.depthWrite = false }
    m.userData.base = spec.opacity ?? 1
    m.opacity = m.userData.base
    m.transparent = m.opacity < 1
    m.onBeforeCompile = shader => {
      Object.assign(shader.uniforms, haze)
      shader.fragmentShader = 'uniform float uHaze; uniform vec3 uHazeCol; uniform float uMoon;\n' + shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        '#include <dithering_fragment>\n  gl_FragColor.rgb += diffuseColor.rgb * vec3(0.5, 0.58, 0.85) * uMoon;\n  gl_FragColor.rgb = mix(gl_FragColor.rgb, uHazeCol, uHaze);',
      )
    }
    m.customProgramCacheKey = () => 'animal-haze'
    o.material = m
    mats.push(m)
  })
  return { haze, mats }
}

/** A fresh animal of one kind, standing on y = 0 and facing +x, or null while its model is still loading. */
function makeAnimal(kind, scale = 1) {
  const asset = animalAssets[kind]
  if (!asset) return null
  const spec = ANIMALS[kind]
  const model = SkeletonUtils.clone(asset.scene)
  model.rotation.y = Math.PI / 2
  model.updateMatrixWorld(true)
  const box = new THREE.Box3().setFromObject(model)
  const size = box.getSize(new THREE.Vector3())
  const s = (spec.size * scale) / Math.max(size.x, size.z)
  model.scale.setScalar(s)
  model.position.y = -box.min.y * s
  const g = new THREE.Group()
  g.add(model)
  const mixer = new THREE.AnimationMixer(model)
  const actions = {}
  for (const clip of asset.animations) actions[clip.name] = mixer.clipAction(clip)
  g.userData = { kind, spec, scale, model, mixer, actions, ...hazeMaterials(model, spec), phase: Math.random() * 10, fade: 1 }
  playClip(g, spec.walk || spec.move, 0)
  return g
}

/** Cross-fades an animal into another clip, starting somewhere in it so a herd never moves in step. */
function playClip(a, name, fade = 0.6) {
  const u = a.userData
  const next = u.actions[name]
  if (!next || u.current === next) return
  next.reset().fadeIn(fade).play()
  next.time = Math.random() * next.getClip().duration
  if (u.current) u.current.fadeOut(fade)
  u.current = next
}

/** Sets how far an animal has sunk into the haze, and its fade in or out. */
const _wp = new THREE.Vector3()
function hazeAnimal(a, fade = 1) {
  const u = a.userData
  const d = camera.position.distanceTo(a.getWorldPosition(_wp))
  const fog = 1 - Math.exp(-d * uniforms.uDensity.value * (1 + uniforms.uFogBoost.value * 5))
  const f = uniforms.uFog.value
  u.haze.uHaze.value = clamp(fog * (u.spec.glow ? 0.6 : 1.05))
  u.haze.uMoon.value = uniforms.uNight.value * 0.45
  u.haze.uHazeCol.value.setRGB(f.x, f.y, f.z)
  if (fade !== u.fade) {
    u.fade = fade
    for (const m of u.mats) { m.opacity = m.userData.base * fade; m.transparent = m.opacity < 0.999 }
  }
}
function dropAnimal(a) {
  scene.remove(a)
  a.traverse(o => { if (o.userData?.mats) for (const m of o.userData.mats) m.dispose() })
}

/** Turns an animal smoothly towards the way it walks. */
function steer(a, dt) {
  const want = a.userData.dir > 0 ? 0 : Math.PI
  a.rotation.y += (want - a.rotation.y) * (1 - Math.exp(-dt * 2.5))
}

/** What a land animal does next: walk a while, then stop to graze, sniff or look around, now and then turning back. */
function decideBehaviour(a, t) {
  const u = a.userData
  if (t < (u.until || 0)) return
  const s = u.spec
  if (u.mode === 'walk') {
    u.mode = 'rest'
    u.speed = 0
    playClip(a, s.rest[Math.floor(Math.random() * s.rest.length)], 0.8)
    u.until = t + 4 + Math.random() * 7
  } else {
    u.mode = 'walk'
    u.speed = s.speed * u.scale * (0.85 + Math.random() * 0.3)
    if (Math.random() < 0.25) u.dir *= -1
    playClip(a, s.walk, 0.8)
    if (u.current) u.current.timeScale = u.speed / (s.speed * u.scale)
    u.until = t + 3 + Math.random() * 5
  }
}

function makeButterfly(color) {
  const g = new THREE.Group()
  const mat = new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.6, emissive: color, emissiveIntensity: 0.15 })
  const wing = new THREE.CircleGeometry(0.07, 10)
  const l = new THREE.Mesh(wing, mat)
  const r = new THREE.Mesh(wing, mat)
  l.position.z = 0.06
  r.position.z = -0.06
  const lp = new THREE.Group(), rp = new THREE.Group()
  lp.add(l); rp.add(r)
  l.rotation.x = Math.PI / 2
  r.rotation.x = Math.PI / 2
  g.add(lp, rp)
  g.userData.wings = [lp, rp]
  return g
}

/** Tints a silhouette by distance the way the landscape shader fogs the land. */
const _haze = new THREE.Color()
function tint(mat, pos, dark = 0.22) {
  const d = camera.position.distanceTo(pos)
  const fog = 1 - Math.exp(-d * uniforms.uDensity.value * (1 + uniforms.uFogBoost.value * 5))
  const f = uniforms.uFog.value
  _haze.setRGB(f.x, f.y, f.z)
  const night = uniforms.uNight.value
  mat.color.setRGB(f.x * dark * (1 - night * 0.6), f.y * dark * (1 - night * 0.6), f.z * dark * (1 - night * 0.4)).lerp(_haze, clamp(fog * 1.1))
  mat.opacity = 1
}

/** A flock of distant birds: that far away a painted silhouette reads better than any model. */
function spawnFlock(cx) {
  const g = new THREE.Group()
  const dir = side()
  const n = 5 + Math.floor(Math.random() * 6)
  for (let i = 0; i < n; i++) {
    const bird = makeFlier('bird', 1.3)
    const row = Math.ceil(i / 2)
    bird.position.set(-row * 0.9, (i % 2 ? 1 : -1) * row * 0.35, -row * 0.6)
    g.add(bird)
  }
  g.scale.x = dir
  g.position.set(cx + (dir > 0 ? -45 : 55), 10 + Math.random() * 8 + groundY(cx), -25 - Math.random() * 25)
  g.userData = { type: 'flock', dir, speed: 4 + Math.random() * 2 }
  scene.add(g)
  fauna.push(g)
}

/** A swarm of real models moving as one: bats in the caves, fish under water, spirits in the fantasy lands. */
function spawnSwarm(cx, kind, n, { z, y, speed, spread, enter = null }) {
  const g = new THREE.Group()
  const dir = side()
  for (let i = 0; i < n; i++) {
    const a = makeAnimal(kind, rnd(0.8, 1.2))
    if (!a) return
    a.position.set((Math.random() - 0.5) * spread[0], (Math.random() - 0.5) * spread[1], (Math.random() - 0.5) * spread[2])
    a.userData.home = a.position.clone()
    g.add(a)
  }
  g.rotation.y = dir > 0 ? 0 : Math.PI
  g.position.set(cx + (enter ? -dir * enter : dir > 0 ? -35 : 50), groundY(cx) + y, z)
  g.userData = { type: 'swarm', kind, dir, speed }
  scene.add(g)
  fauna.push(g)
}

/** One big animal passing slowly in the distance: a whale, a manta or dolphins under water, a dragon in the sky. */
function spawnCruiser(cx, kind, { z, y, speed, enter = null }) {
  const a = makeAnimal(kind)
  if (!a) return
  const dir = side()
  a.rotation.y = dir > 0 ? 0 : Math.PI
  a.position.set(cx + (enter ? -dir * enter : dir > 0 ? -60 : 75), groundY(cx) + y, z)
  Object.assign(a.userData, { type: 'cruiser', dir, speed, baseY: a.position.y })
  scene.add(a)
  fauna.push(a)
}

/** Deer (sometimes led by a stag) or wolves, standing on the hills behind the trail. */
function spawnGrazers(cx, only = null) {
  const night = uniforms.uNight.value
  const r = Math.random()
  const kind = only || (night > 0.4 && r < 0.5 ? 'wolf' : r < 0.7 ? 'deer' : 'wolf')
  const n = kind === 'deer' ? 2 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * 2)
  const baseX = cx + 30 + Math.random() * 25
  const z = -8 - Math.random() * 9
  const pts = Array.from({ length: n }, (_, i) => [baseX + i * 2.4 + Math.random(), z + (Math.random() - 0.5) * 2])
  const hs = landHeights(pts)
  if (!hs) return
  const herdDir = side()
  pts.forEach(([x, zz], i) => {
    if (hs[i] < uniforms.uWater.value + 0.05) return
    const k = kind === 'deer' && i === 0 && Math.random() < 0.6 ? 'stag' : kind
    const a = makeAnimal(k, rnd(0.9, 1.1))
    if (!a) return
    const dir = Math.random() < 0.8 ? herdDir : -herdDir
    a.position.set(x, hs[i] - 0.02, zz)
    a.rotation.y = dir > 0 ? 0 : Math.PI
    Object.assign(a.userData, { type: 'grazer', dir, baseY: hs[i] - 0.02, mode: 'rest', until: 0 })
    scene.add(a)
    fauna.push(a)
  })
}

const butterflies = []
for (let i = 0; i < 4; i++) {
  const bf = makeButterfly([0xffd25a, 0x9fd8ff, 0xff9ec8, 0xffffff][i])
  bf.userData.phase = Math.random() * 10
  bf.visible = false
  scene.add(bf)
  butterflies.push(bf)
}

function updateFauna(t, dt, b, night, weatherKind) {
  const cx = camera.position.x
  const wet = weatherKind === 'rain' || weatherKind === 'storm' || weatherKind === 'sandstorm'
  nextFlock -= dt
  if (nextFlock < 0) {
    nextFlock = 18 + Math.random() * 30
    if (b.mode === 3) spawnSwarm(cx, 'fish', 9 + Math.floor(Math.random() * 7), { z: rnd(-13, -5), y: rnd(1.5, 4.5), speed: 1.6, spread: [4, 1.6, 2.5] })
    else if (b.mode === 1) spawnSwarm(cx, 'bat', 5 + Math.floor(Math.random() * 4), { z: rnd(-6, -2.5), y: rnd(1.4, 2.4), speed: 3.5, spread: [5, 1.4, 2.5] })
    else if (b.mode === 4 && Math.random() < 0.5) spawnSwarm(cx, 'ghost', 2 + Math.floor(Math.random() * 3), { z: rnd(-12, -4), y: rnd(1.2, 2.7), speed: 0.6, spread: [6, 1.2, 3] })
    else if (b.mode !== 2 && !wet && night < 0.7) spawnFlock(cx)
  }
  nextVisitor -= dt
  if (nextVisitor < 0) {
    nextVisitor = 40 + Math.random() * 50
    if (b.mode === 3) {
      const kind = ['whale', 'manta', 'dolphin', 'dolphin'][Math.floor(Math.random() * 4)]
      if (kind === 'dolphin') for (let i = 0; i < 3; i++) spawnCruiser(cx + i * 2.5, kind, { z: rnd(-16, -10), y: rnd(2, 4), speed: 3 })
      else spawnCruiser(cx, kind, kind === 'whale' ? { z: rnd(-45, -32), y: rnd(5, 9), speed: 1.2 } : { z: rnd(-22, -14), y: rnd(3, 6), speed: 1.4 })
    } else if (b.mode === 4 && !wet) spawnCruiser(cx, 'dragon', { z: rnd(-40, -25), y: rnd(9, 15), speed: 3.5 })
  }
  nextGrazers -= dt
  if (nextGrazers < 0) {
    nextGrazers = 14 + Math.random() * 22
    if (b.mode === 0 && weatherKind !== 'sandstorm') spawnGrazers(cx)
  }
  const wantEagle = b.mode === 0 && b.amp > 0.9 && night < 0.6 && !wet
  if (wantEagle && !eagle) { eagle = makeFlier('eagle', 2.4); scene.add(eagle) }
  else if (!wantEagle && eagle) { scene.remove(eagle); eagle = null }
  if (eagle) {
    const a = t * 0.1
    eagle.position.set(cx + 8 + Math.cos(a) * 12, groundY(cx) + 17 + Math.sin(a * 2) * 1.5, -40 + Math.sin(a) * 6)
    eagle.scale.x = 2.6 * (Math.sin(a) > 0 ? -1 : 1)
    flap(eagle, t, 2.5, 1)
    tint(eagle.userData.mat, eagle.position)
  }
  regroundTimer -= dt
  if (regroundTimer < 0) {
    regroundTimer = 1.5
    const grazers = fauna.filter(g => g.userData.type === 'grazer').slice(0, PROBE_N)
    const hs = grazers.length ? landHeights(grazers.map(g => [g.position.x, g.position.z])) : null
    if (hs) grazers.forEach((g, j) => {
      const h = hs[j] - 0.03
      if (!Number.isFinite(h) || h < uniforms.uWater.value || Math.abs(h - g.userData.baseY) > 3) { g.userData.gone = true; return }
      g.userData.baseY = h
    })
  }
  for (let i = fauna.length - 1; i >= 0; i--) {
    const g = fauna[i]
    const u = g.userData
    u.born ??= t
    const fadeIn = clamp((t - u.born) / 1.5)
    if (u.type === 'flock') {
      g.position.x += u.dir * u.speed * dt
      g.position.y += Math.sin(t * 0.5 + i) * 0.004
      for (const c of g.children) { flap(c, t, 8); tint(c.userData.mat, g.position, 0.22) }
      if (Math.abs(g.position.x - cx) > 70) { scene.remove(g); fauna.splice(i, 1) }
    } else if (u.type === 'swarm') {
      g.position.x += u.dir * u.speed * dt
      const bob = u.kind === 'bat' ? 0.35 : u.kind === 'ghost' ? 0.25 : 0.12
      for (const c of g.children) {
        const cu = c.userData
        cu.mixer.update(dt)
        c.position.y = cu.home.y + Math.sin(t * (u.kind === 'bat' ? 3 : 0.9) + cu.phase) * bob
        c.position.x = cu.home.x + Math.sin(t * 0.4 + cu.phase) * 0.3
        hazeAnimal(c, fadeIn)
      }
      if (Math.abs(g.position.x - cx) > 70) { dropAnimal(g); fauna.splice(i, 1) }
    } else if (u.type === 'cruiser') {
      g.position.x += u.dir * u.speed * dt
      g.position.y = u.baseY + Math.sin(t * 0.3 + u.phase) * 0.6
      u.mixer.update(dt * (u.kind === 'whale' ? 0.5 : 1))
      hazeAnimal(g, fadeIn)
      if (Math.abs(g.position.x - cx) > 90) { dropAnimal(g); fauna.splice(i, 1) }
    } else if (u.type === 'grazer') {
      if (u.gone) {
        u.out = (u.out ?? 1) - dt * 1.5
        hazeAnimal(g, Math.max(0, u.out))
        if (u.out <= 0) { dropAnimal(g); fauna.splice(i, 1) }
        continue
      }
      decideBehaviour(g, t)
      g.position.x += u.dir * (u.speed || 0) * dt
      g.position.y = u.baseY
      steer(g, dt)
      u.mixer.update(dt)
      hazeAnimal(g, fadeIn)
      if (g.position.x < cx - 40 || g.position.x > cx + 90) { dropAnimal(g); fauna.splice(i, 1) }
    }
  }
  const showBf = (b.mode === 0 || b.mode === 4) && night < 0.4 && !wet && weatherKind !== 'snow'
  butterflies.forEach(bf => {
    bf.visible = showBf
    if (!showBf) return
    const ph = bf.userData.phase
    const x = fox.position.x + Math.sin(t * 0.21 + ph) * 4 + 1.5
    bf.position.set(x, groundY(x) + 0.8 + Math.sin(t * 1.3 + ph) * 0.4, -1 + Math.cos(t * 0.37 + ph) * 1.6)
    const a = Math.sin(t * 22 + ph) * 1.1
    bf.userData.wings[0].rotation.x = a
    bf.userData.wings[1].rotation.x = -a
    bf.rotation.y = Math.cos(t * 0.21 + ph) > 0 ? 0 : Math.PI
  })
}


// ---------- obstacles on the trail, jumped by every fox ----------
const obstacles = []
const geoCache = {}
const G = (key, make) => (geoCache[key] ||= make())
let obstaclesUntil = 14
function extendObstacles(until) {
  while (obstaclesUntil < until) {
    const r = rng(daySeed + Math.floor(obstaclesUntil * 7.3) + 31)
    r()
    const x = obstaclesUntil + 20 + r() * 40
    obstaclesUntil = x
    if (route.some(seg => seg.portal && Math.abs(seg.start - x) < 5)) continue
    obstacles.push({ x, seed: Math.floor(r() * 1e6), mesh: null })
  }
}

function obstacleMesh(o, biome) {
  const r = rng(o.seed)
  const g = new THREE.Group()
  const mode = biome.mode
  if (mode === 1) {
    const c = biome.glow || '#7fe6ff'
    for (let i = 0; i < 4; i++) {
      const m = new THREE.Mesh(G('crys', () => new THREE.OctahedronGeometry(0.2, 0)), soft(c, { emissive: c, emissiveIntensity: 1.2, flatShading: true, roughness: 0.3 }))
      m.scale.set(0.6, 1.4 + r(), 0.6)
      m.position.set((i - 1.5) * 0.14, 0.18, (r() - 0.5) * 0.3)
      m.rotation.z = (i - 1.5) * 0.3
      g.add(m)
    }
  } else if (mode === 3) {
    const c = ['#ff8a7a', '#ffb35c', '#d47cff'][Math.floor(r() * 3)]
    for (let i = 0; i < 6; i++) {
      const m = new THREE.Mesh(G('coralb', () => new THREE.CapsuleGeometry(0.04, 0.3, 4, 8)), soft(c))
      m.position.set((r() - 0.5) * 0.4, 0.18, (r() - 0.5) * 0.4)
      m.rotation.z = (r() - 0.5) * 1.1
      g.add(m)
    }
  } else if (mode === 4) {
    for (let i = 0; i < 4; i++) {
      const m = new THREE.Mesh(G('puff', () => new THREE.IcosahedronGeometry(0.2, 2)), soft('#ffffff', { roughness: 1 }))
      m.position.set((i - 1.5) * 0.15, 0.15 + Math.sin(i * 2) * 0.05, (r() - 0.5) * 0.2)
      m.scale.setScalar(0.8 + r() * 0.5)
      g.add(m)
    }
  } else {
    const kind = mode === 2 ? 'rock' : ['log', 'log', 'rock', 'stump'][Math.floor(r() * 4)]
    if (kind === 'log') {
      const len = 1.2 + r() * 0.5
      const bark = new THREE.Mesh(G('log', () => new THREE.CylinderGeometry(0.17, 0.19, 1, 14)), soft('#6b4a32', { roughness: 0.95 }))
      bark.scale.y = len
      bark.rotation.x = Math.PI / 2
      bark.rotation.z = (r() - 0.5) * 0.4
      bark.position.y = 0.16
      const ringMat = soft('#c9a57a')
      for (const side of [-1, 1]) {
        const ring = new THREE.Mesh(G('ring', () => new THREE.CircleGeometry(0.165, 14)), ringMat)
        ring.position.set(Math.sin(bark.rotation.z) * -side * len / 2, 0.16, side * len / 2 * Math.cos(bark.rotation.z))
        ring.rotation.y = side > 0 ? 0 : Math.PI
        g.add(ring)
      }
      g.add(bark)
      if (r() < 0.5) {
        const moss = new THREE.Mesh(G('moss', () => new THREE.SphereGeometry(0.12, 8, 6)), soft('#5f8f3e'))
        moss.scale.set(1.4, 0.5, 1)
        moss.position.set(0, 0.33, (r() - 0.5) * 0.5)
        g.add(moss)
      }
    } else if (kind === 'stump') {
      const stump = new THREE.Mesh(G('stump', () => new THREE.CylinderGeometry(0.2, 0.26, 0.38, 12)), soft('#6f4f36'))
      stump.position.y = 0.19
      const top = new THREE.Mesh(G('stumptop', () => new THREE.CircleGeometry(0.2, 12)), soft('#c8a477'))
      top.rotation.x = -Math.PI / 2
      top.position.y = 0.385
      g.add(stump, top)
    } else {
      const rockGeo = new THREE.DodecahedronGeometry(0.3, 0)
      const pos = rockGeo.attributes.position
      const salt = o.seed % 9973
      for (let i = 0; i < pos.count; i++) {
        const k = Math.round(pos.getX(i) * 1000) * 73856093 ^ Math.round(pos.getY(i) * 1000) * 19349663 ^ Math.round(pos.getZ(i) * 1000) * 83492791
        const j = 0.82 + hash(k + salt) * 0.36
        pos.setXYZ(i, pos.getX(i) * j, pos.getY(i) * j, pos.getZ(i) * j)
      }
      rockGeo.computeVertexNormals()
      const rock = new THREE.Mesh(rockGeo, soft(mode === 2 ? '#8d8f96' : '#8a857d', { flatShading: true }))
      rock.scale.set(1.25, 0.7 + r() * 0.25, 1.05)
      rock.rotation.y = r() * 3
      rock.position.y = 0.07
      g.add(rock)
      if (r() < 0.6) {
        const small = rock.clone()
        small.scale.multiplyScalar(0.45)
        small.position.set(0.32, 0.06, 0.2)
        g.add(small)
      }
    }
  }
  return g
}

function ensureObstacles(x) {
  extendObstacles(x + 80)
  for (const o of obstacles) {
    const near = o.x > x - 50 && o.x < x + 70
    if (near && !o.mesh) {
      const m = mixAt(o.x)
      o.mesh = obstacleMesh(o, m.k < 0.5 ? m.a : m.b)
      o.mesh.position.set(o.x, groundY(o.x) - 0.04, 0.05)
      o.mesh.rotation.z = Math.atan((groundY(o.x + 0.3) - groundY(o.x - 0.3)) / 0.6)
      scene.add(o.mesh)
    } else if (!near && o.mesh) {
      scene.remove(o.mesh)
      o.mesh = null
    }
  }
}

/** The next obstacle ahead of x, if any. */
function obstacleAhead(x) {
  for (const o of obstacles) if (o.x > x) return o
  return null
}

// ---------- sound: generated ambient music, nature that follows the world, and soft cues ----------
const ROOTS = { bright: 50, night: 45, cave: 38, space: 47, sea: 43, dream: 52, storm: 41 }
const mtof = n => 440 * 2 ** ((n - 69) / 12)

const audio = {
  ctx: null, on: false, levels: { music: 0.7, nature: 0.7, fx: 0.6 }, buses: {}, mood: 'bright', busy: 0,
  weather: 'clear', mode: 0, night: 0, lastFlash: 0, nextChord: 0, nextBell: 0, nextBird: 0, nextCritter: 0, nextDrip: 0, chordIndex: 0, cutoff: 1800, area: null, pending: null, pendingSince: 0, nextMotif: 0, nextArp: 0, chord: null,
}
try { Object.assign(audio.levels, JSON.parse(localStorage.getItem('foxtrail-audio') || '{}').levels || {}) } catch {}
const wantsSound = (() => { try { return JSON.parse(localStorage.getItem('foxtrail-audio') || '{}').on === true } catch { return false } })()
function saveAudio() { try { localStorage.setItem('foxtrail-audio', JSON.stringify({ on: audio.on, levels: audio.levels })) } catch {} }

function noiseBuffer(ctx, seconds, brown = false) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate)
  const d = buf.getChannelData(0)
  let last = 0
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5 } else d[i] = w
  }
  return buf
}
function loopNoise(brown) {
  const src = audio.ctx.createBufferSource()
  src.buffer = brown ? audio.brown : audio.white
  src.loop = true
  src.start()
  return src
}

function startAudio() {
  if (audio.ctx) { audio.ctx.resume(); return }
  const ctx = new (window.AudioContext || window.webkitAudioContext)()
  audio.ctx = ctx
  audio.white = noiseBuffer(ctx, 3)
  audio.brown = noiseBuffer(ctx, 4, true)
  const master = ctx.createGain()
  master.gain.value = 0.9
  const comp = ctx.createDynamicsCompressor()
  comp.threshold.value = -18
  comp.ratio.value = 3
  master.connect(comp).connect(ctx.destination)
  audio.master = master
  const reverb = ctx.createConvolver()
  const ir = ctx.createBuffer(2, ctx.sampleRate * 4.5, ctx.sampleRate)
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c)
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6)
  }
  reverb.buffer = ir
  const wet = ctx.createGain()
  wet.gain.value = 0.55
  reverb.connect(wet).connect(master)
  audio.reverb = reverb
  for (const name of ['music', 'nature', 'fx']) {
    const g = ctx.createGain()
    g.gain.value = audio.levels[name]
    g.connect(master)
    audio.buses[name] = g
  }
  // music: a filtered pad bus and a slow bass drone
  const padFilter = ctx.createBiquadFilter()
  padFilter.type = 'lowpass'
  padFilter.frequency.value = audio.cutoff
  padFilter.Q.value = 0.4
  const padGain = ctx.createGain()
  padGain.gain.value = 0.22
  padFilter.connect(padGain)
  padGain.connect(audio.buses.music)
  padGain.connect(reverb)
  audio.padIn = padFilter
  const bass = ctx.createOscillator()
  bass.type = 'sine'
  bass.frequency.value = mtof(ROOTS.bright - 12)
  const bassGain = ctx.createGain()
  bassGain.gain.value = 0.0
  bass.connect(bassGain).connect(audio.buses.music)
  bass.start()
  audio.bass = bass
  audio.bassGain = bassGain
  const drone = ctx.createOscillator()
  drone.type = 'sine'
  drone.frequency.value = mtof(ROOTS.bright - 5)
  const droneGain = ctx.createGain()
  droneGain.gain.value = 0
  drone.connect(droneGain)
  droneGain.connect(audio.buses.music)
  droneGain.connect(reverb)
  drone.start()
  audio.drone = drone
  audio.droneGain = droneGain
  // nature beds: wind, rain, deep hum
  const wind = loopNoise(true)
  const windFilter = ctx.createBiquadFilter()
  windFilter.type = 'bandpass'
  windFilter.frequency.value = 500
  windFilter.Q.value = 0.6
  const windGain = ctx.createGain()
  windGain.gain.value = 0
  wind.connect(windFilter).connect(windGain).connect(audio.buses.nature)
  audio.wind = { filter: windFilter, gain: windGain }
  const rain = loopNoise(false)
  const rainHp = ctx.createBiquadFilter()
  rainHp.type = 'highpass'
  rainHp.frequency.value = 900
  const rainLp = ctx.createBiquadFilter()
  rainLp.type = 'lowpass'
  rainLp.frequency.value = 7000
  const rainGain = ctx.createGain()
  rainGain.gain.value = 0
  rain.connect(rainHp).connect(rainLp).connect(rainGain).connect(audio.buses.nature)
  audio.rain = { gain: rainGain }
  const hum = loopNoise(true)
  const humLp = ctx.createBiquadFilter()
  humLp.type = 'lowpass'
  humLp.frequency.value = 160
  const humGain = ctx.createGain()
  humGain.gain.value = 0
  hum.connect(humLp).connect(humGain).connect(audio.buses.nature)
  audio.hum = { gain: humGain, filter: humLp }
  audio.nextChord = 0
  if (comfort.on || comfort.freq) setupComfort()
}

function setLevel(name, v) {
  audio.levels[name] = v
  if (audio.buses[name]) audio.buses[name].gain.setTargetAtTime(v, audio.ctx.currentTime, 0.1)
  saveAudio()
}

function bell(note, at = 0, level = 0.12, bus = 'music') {
  const ctx = audio.ctx
  const t = ctx.currentTime + at
  if (comfort.on) { note -= 12; level *= 0.6 }
  for (const [mult, amp] of comfort.on ? [[1, 1]] : [[1, 1], [2.01, 0.35], [3.02, 0.12]]) {
    const o = ctx.createOscillator()
    o.type = 'sine'
    o.frequency.value = mtof(note) * mult
    const g = ctx.createGain()
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(level * amp, t + (comfort.on ? 0.25 : 0.01))
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 / mult)
    o.connect(g)
    g.connect(audio.buses[bus])
    g.connect(audio.reverb)
    o.start(t)
    o.stop(t + 3)
  }
}

function chirp() {
  if (comfort.on) return
  const ctx = audio.ctx
  const t0 = ctx.currentTime
  const base = 2200 + Math.random() * 1800
  const notes = 2 + Math.floor(Math.random() * 5)
  for (let i = 0; i < notes; i++) {
    const t = t0 + i * (0.09 + Math.random() * 0.08)
    const o = ctx.createOscillator()
    o.type = 'sine'
    o.frequency.setValueAtTime(base * (0.9 + Math.random() * 0.3), t)
    o.frequency.exponentialRampToValueAtTime(base * (1.2 + Math.random() * 0.5), t + 0.06)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(0.025, t + 0.01)
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08)
    const pan = ctx.createStereoPanner()
    pan.pan.value = Math.random() * 1.6 - 0.8
    o.connect(g).connect(pan)
    pan.connect(audio.buses.nature)
    pan.connect(audio.reverb)
    o.start(t)
    o.stop(t + 0.1)
  }
}

function crickets() {
  if (comfort.on) return
  const ctx = audio.ctx
  const t0 = ctx.currentTime
  const f = 4200 + Math.random() * 600
  const pan = ctx.createStereoPanner()
  pan.pan.value = Math.random() * 1.6 - 0.8
  pan.connect(audio.buses.nature)
  for (let i = 0; i < 6; i++) {
    const t = t0 + i * 0.045
    const o = ctx.createOscillator()
    o.frequency.value = f
    const g = ctx.createGain()
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(0.012, t + 0.008)
    g.gain.linearRampToValueAtTime(0, t + 0.03)
    o.connect(g).connect(pan)
    o.start(t)
    o.stop(t + 0.04)
  }
}

function hoot() {
  if (comfort.on) return
  const ctx = audio.ctx
  for (const [at, f, len] of [[0, 410, 0.35], [0.5, 380, 0.25], [0.8, 380, 0.6]]) {
    const t = ctx.currentTime + at
    const o = ctx.createOscillator()
    o.frequency.setValueAtTime(f, t)
    o.frequency.linearRampToValueAtTime(f * 0.94, t + len)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(0.035, t + 0.06)
    g.gain.linearRampToValueAtTime(0, t + len)
    o.connect(g)
    g.connect(audio.buses.nature)
    g.connect(audio.reverb)
    o.start(t)
    o.stop(t + len + 0.05)
  }
}

function drip(bubble = false) {
  if (comfort.on) return
  const ctx = audio.ctx
  const t = ctx.currentTime
  const f = bubble ? 300 + Math.random() * 300 : 900 + Math.random() * 900
  const o = ctx.createOscillator()
  o.frequency.setValueAtTime(f, t)
  o.frequency.exponentialRampToValueAtTime(bubble ? f * 2.2 : f * 0.45, t + (bubble ? 0.12 : 0.08))
  const g = ctx.createGain()
  g.gain.setValueAtTime(0, t)
  g.gain.linearRampToValueAtTime(bubble ? 0.03 : 0.05, t + 0.005)
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15)
  o.connect(g)
  g.connect(audio.buses.nature)
  g.connect(audio.reverb)
  o.start(t)
  o.stop(t + 0.2)
}

function thunder() {
  const ctx = audio.ctx
  const t = ctx.currentTime + 0.3 + Math.random() * 1.2
  const src = ctx.createBufferSource()
  src.buffer = audio.brown
  const lp = ctx.createBiquadFilter()
  lp.type = 'lowpass'
  lp.frequency.setValueAtTime(900, t)
  lp.frequency.exponentialRampToValueAtTime(90, t + 4)
  const g = ctx.createGain()
  g.gain.setValueAtTime(0, t)
  g.gain.linearRampToValueAtTime(0.9, t + 0.08)
  g.gain.exponentialRampToValueAtTime(0.001, t + 5)
  src.connect(lp).connect(g)
  g.connect(audio.buses.nature)
  g.connect(audio.reverb)
  src.start(t)
  src.stop(t + 5.2)
}

const cue = {
  commit() { if (audio.on) { bell(84, 0, 0.1, 'fx'); bell(91, 0.12, 0.07, 'fx') } },
  green() { if (audio.on) [72, 76, 79, 84].forEach((n, i) => bell(n, i * 0.11, 0.08, 'fx')) },
  red() { if (audio.on) { bell(52, 0, 0.12, 'fx'); bell(51, 0.35, 0.1, 'fx') } },
  howl() {
    if (!audio.on) return
    const ctx = audio.ctx
    const t = ctx.currentTime
    const o = ctx.createOscillator()
    o.type = 'sawtooth'
    o.frequency.setValueAtTime(520, t)
    o.frequency.linearRampToValueAtTime(880, t + 0.25)
    o.frequency.linearRampToValueAtTime(700, t + 0.9)
    const bp = ctx.createBiquadFilter()
    bp.type = 'bandpass'
    bp.frequency.value = 1200
    bp.Q.value = 3
    const g = ctx.createGain()
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(0.05, t + 0.15)
    g.gain.linearRampToValueAtTime(0, t + 1)
    o.connect(bp).connect(g)
    g.connect(audio.buses.fx)
    g.connect(audio.reverb)
    o.start(t)
    o.stop(t + 1.05)
  },
}

// ---------- music per area: every place has its own key, mode, instrument, chords and little motif ----------
const MODES = {
  ionian: [0, 2, 4, 5, 7, 9, 11],
  lydian: [0, 2, 4, 6, 7, 9, 11],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  pentatonic: [0, 2, 4, 7, 9],
  dorian: [0, 2, 3, 5, 7, 9, 10],
  aeolian: [0, 2, 3, 5, 7, 8, 10],
  phrygian: [0, 1, 3, 5, 7, 8, 10],
  hirajoshi: [0, 2, 3, 7, 8],
  desert: [0, 1, 4, 5, 7, 8, 10],
  wholetone: [0, 2, 4, 6, 8, 10],
  lydianAug: [0, 2, 4, 6, 8, 9, 11],
}
const PROGRESSIONS = [[0, 3, 4, 0], [0, 5, 3, 4], [0, 2, 5, 3], [0, 4, 5, 3], [0, 3, 0, 4, 5, 3], [0, 5, 1, 4]]

/** The music of one area, decided by its name so the same place always sounds the same. */
function areaMusic(biome) {
  if (biome.music) return biome.music
  const r = rng(Math.floor(hash(biome.name.split('').reduce((h, c) => h * 31 + c.charCodeAt(0), 11)) * 1e9) + 7)
  const pickOne = list => list[Math.floor(r() * list.length)]
  const span = (a, b) => a + r() * (b - a)
  const desert = /dune|desert/i.test(biome.name)
  const snowy = biome.snow !== undefined && biome.snow < 0.3
  let m
  if (biome.mode === 1) m = { mode: pickOne(['aeolian', 'phrygian', 'hirajoshi']), lead: 'glass', pad: 'sine', cutoff: span(600, 900), root: 36 + Math.floor(r() * 7), chordSec: span(13, 18), arp: r() < 0.25, drone: 7 }
  else if (biome.mode === 2) m = { mode: pickOne(['lydian', 'wholetone', 'lydianAug']), lead: pickOne(['glass', 'celesta']), pad: 'sine', cutoff: span(1600, 2400), root: 40 + Math.floor(r() * 7), chordSec: span(14, 20), arp: false, drone: 12 }
  else if (biome.mode === 3) m = { mode: pickOne(['dorian', 'aeolian']), lead: 'flute', pad: 'sine', cutoff: span(500, 800), root: 41 + Math.floor(r() * 5), chordSec: span(12, 16), arp: r() < 0.45, drone: 7 }
  else if (biome.mode === 4) m = { mode: pickOne(['lydian', 'ionian', 'pentatonic']), lead: 'celesta', pad: 'triangle', cutoff: span(2600, 3400), root: 50 + Math.floor(r() * 5), chordSec: span(9, 13), arp: r() < 0.7, drone: 12 }
  else if (desert) m = { mode: 'desert', lead: 'flute', pad: 'triangle', cutoff: span(1400, 2000), root: 45 + Math.floor(r() * 4), chordSec: span(12, 16), arp: r() < 0.4, drone: 7 }
  else if (snowy) m = { mode: pickOne(['lydian', 'pentatonic']), lead: 'glass', pad: 'sine', cutoff: span(1800, 2600), root: 47 + Math.floor(r() * 5), chordSec: span(11, 15), arp: r() < 0.35, drone: 12 }
  else m = { mode: pickOne(['ionian', 'lydian', 'mixolydian', 'pentatonic']), lead: pickOne(['pluck', 'flute', 'marimba']), pad: pickOne(['triangle', 'triangle', 'sawtooth']), cutoff: span(1800, 2800), root: 45 + Math.floor(r() * 8), chordSec: span(9, 13), arp: r() < 0.6, drone: 7 }
  const scale = MODES[m.mode]
  m.scale = scale
  m.progression = pickOne(PROGRESSIONS).map(d => d % scale.length)
  let deg = Math.floor(r() * 3)
  m.motif = Array.from({ length: 4 + Math.floor(r() * 3) }, () => {
    deg = Math.max(0, Math.min(scale.length + 2, deg + pickOne([-2, -1, -1, 1, 1, 2, 0])))
    return { deg, dur: pickOne([0.45, 0.6, 0.6, 0.9, 1.2]) }
  })
  m.motifEvery = span(22, 40)
  m.arpRate = span(0.42, 0.7)
  m.arpPattern = pickOne([[0, 1, 2, 1], [0, 2, 1, 3], [0, 1, 2, 3], [2, 1, 0, 1]])
  m.arpTimbre = m.lead === 'flute' || m.lead === 'glass' ? 'pluck' : m.lead
  biome.music = m
  return m
}

const noteOf = (m, deg, octave = 0) => m.root + m.scale[((deg % m.scale.length) + m.scale.length) % m.scale.length] + 12 * (Math.floor(deg / m.scale.length) + octave)

/** A lead note in one of the area's voices. */
function voice(timbre, note, at = 0, level = 0.05, dur = 0.6) {
  const ctx = audio.ctx
  const t = ctx.currentTime + at
  if (comfort.on) { note = Math.min(note, 79) - (note > 72 ? 12 : 0); level *= 0.7 }
  const f = mtof(note)
  const out = ctx.createGain()
  out.gain.value = level
  const lp = ctx.createBiquadFilter()
  lp.type = 'lowpass'
  lp.frequency.value = comfort.on ? 1600 : 6000
  out.connect(lp)
  lp.connect(audio.buses.music)
  lp.connect(audio.reverb)
  const partials = {
    glass: [[1, 1, 4], [2.76, 0.22, 2.2], [5.4, 0.07, 1.2]],
    celesta: [[1, 1, 1.8], [2, 0.3, 1], [4, 0.12, 0.5]],
    marimba: [[1, 1, 0.9], [3.9, 0.14, 0.25]],
    pluck: [[1, 1, 1.4], [2, 0.25, 0.7]],
    flute: [[1, 1, dur + 0.6], [2, 0.08, dur + 0.6]],
  }[timbre] || [[1, 1, 2]]
  for (const [mult, amp, decay] of comfort.on ? partials.filter(p => p[0] < 3) : partials) {
    const o = ctx.createOscillator()
    o.type = timbre === 'pluck' && mult === 1 ? 'triangle' : 'sine'
    o.frequency.value = f * mult
    const g = ctx.createGain()
    if (timbre === 'flute') {
      g.gain.setValueAtTime(0, t)
      g.gain.linearRampToValueAtTime(amp, t + 0.25)
      g.gain.setValueAtTime(amp, t + dur)
      g.gain.linearRampToValueAtTime(0, t + dur + 0.6)
      const vib = ctx.createOscillator()
      vib.frequency.value = 4.8
      const depth = ctx.createGain()
      depth.gain.value = f * mult * 0.004
      vib.connect(depth).connect(o.frequency)
      vib.start(t)
      vib.stop(t + dur + 0.7)
    } else {
      g.gain.setValueAtTime(0, t)
      g.gain.linearRampToValueAtTime(amp, t + (comfort.on ? 0.12 : 0.006))
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay)
    }
    o.connect(g).connect(out)
    o.start(t)
    o.stop(t + decay + 0.1)
  }
}

/** One pad chord from the area's progression, with a long, soft swell. */
function playAreaChord(m, swell) {
  const ctx = audio.ctx
  const now = ctx.currentTime
  const deg = m.progression[audio.chordIndex++ % m.progression.length]
  const count = m.scale.length < 6 ? 3 : 4
  const notes = Array.from({ length: count }, (_, i) => noteOf(m, deg + i * 2))
  audio.chord = { deg, notes }
  const length = m.chordSec + 5
  const attack = swell ? 7 : 4
  for (const n of notes) {
    for (const detune of [-6, 7]) {
      const o = ctx.createOscillator()
      o.type = m.pad
      o.frequency.value = mtof(n)
      o.detune.value = detune
      const g = ctx.createGain()
      const peak = m.pad === 'sawtooth' ? 0.05 : 0.09
      g.gain.setValueAtTime(0, now)
      g.gain.linearRampToValueAtTime(peak, now + attack)
      g.gain.setValueAtTime(peak, now + length - 5)
      g.gain.linearRampToValueAtTime(0, now + length)
      o.connect(g).connect(audio.padIn)
      o.start(now)
      o.stop(now + length + 0.1)
    }
  }
  audio.bass.frequency.setTargetAtTime(mtof(noteOf(m, deg) - 12), now, swell ? 4 : 2)
  if (audio.drone) audio.drone.frequency.setTargetAtTime(mtof(noteOf(m, deg) - 12 + m.drone), now, swell ? 4 : 2)
}

/** The area's motif, a little different each time: shifted to the chord, a note sometimes left out. */
function playMotif(m, night) {
  const shift = audio.chord ? audio.chord.deg % 3 : 0
  let at = 0
  for (const step of m.motif) {
    if (Math.random() < 0.15) { at += step.dur; continue }
    voice(m.lead, noteOf(m, step.deg + shift, night > 0.5 ? 1 : 2), at, night > 0.5 ? 0.032 : 0.045, step.dur)
    at += step.dur * (night > 0.5 ? 1.25 : 1)
  }
}

/** Runs the music of the area the pack is in, and moves to the next area slowly. */
function updateMusic(biome, night, weather, busy) {
  const ctx = audio.ctx
  const now = ctx.currentTime
  const target = areaMusic(biome)
  const storm = weather === 'storm' || weather === 'rain'
  if (target !== audio.area && target !== audio.pending) { audio.pending = target; audio.pendingSince = now }
  const changing = !!audio.pending
  if (changing && (!audio.area || (now - audio.pendingSince > 6 && now > audio.nextChord - 0.5))) {
    audio.area = audio.pending
    audio.pending = null
    audio.chordIndex = 0
    playAreaChord(audio.area, true)
    audio.nextChord = now + audio.area.chordSec
    audio.nextMotif = now + 8
    audio.nextArp = now + 6
    return
  }
  const m = audio.area
  if (!m) return
  const cutoff = Math.min(comfort.on ? 1400 : 99999, m.cutoff * (night > 0.5 ? 0.6 : 1) * (storm ? 0.55 : 1))
  audio.padIn.frequency.setTargetAtTime(cutoff, now, 4)
  audio.bassGain.gain.setTargetAtTime(biome.mode === 4 ? 0.03 : 0.07, now, 3)
  if (audio.droneGain) audio.droneGain.gain.setTargetAtTime(biome.mode === 1 || biome.mode === 2 ? 0.035 : 0.015, now, 4)
  if (now > audio.nextChord) { playAreaChord(m, false); audio.nextChord = now + m.chordSec * (night > 0.5 ? 1.2 : 1) }
  if (changing) return
  if (now > audio.nextMotif) {
    if (!storm || Math.random() < 0.4) playMotif(m, night)
    audio.nextMotif = now + m.motifEvery * (night > 0.5 ? 1.4 : 1) * lerp(1.15, 0.85, busy) + Math.random() * 8
  }
  if (m.arp && !storm && audio.chord && now > audio.nextArp) {
    const rate = m.arpRate * (night > 0.5 ? 1.6 : 1)
    const bars = 4
    for (let i = 0; i < bars * m.arpPattern.length; i++) {
      const idx = m.arpPattern[i % m.arpPattern.length] % audio.chord.notes.length
      if (Math.random() < (night > 0.5 ? 0.35 : 0.15)) continue
      voice(m.arpTimbre, audio.chord.notes[idx] + 12, i * rate, (night > 0.5 ? 0.016 : 0.024) * lerp(0.85, 1.15, busy), rate * 0.9)
    }
    audio.nextArp = now + bars * m.arpPattern.length * rate + 4 + Math.random() * 10
  }
}

/** Called every frame: follows the place, the hour, the weather and how busy the pack is. */
function updateAudio(biomeNow, night, weather, busy, amp, flash) {
  const mode = biomeNow.mode
  if (!audio.on || !audio.ctx) return
  const ctx = audio.ctx
  const now = ctx.currentTime
  updateMusic(biomeNow, night, weather, busy)
  const wet = weather === 'rain' ? 0.35 : weather === 'storm' ? 0.55 : 0
  const windy = (mode === 0 ? 0.12 + amp * 0.12 : mode === 4 ? 0.08 : 0.02) + (weather === 'storm' ? 0.35 : weather === 'snow' ? 0.15 : weather === 'sandstorm' ? 0.5 : 0)
  audio.rain.gain.gain.setTargetAtTime(wet * 0.25, now, 2)
  audio.wind.gain.gain.setTargetAtTime(windy * 0.5, now, 2)
  audio.wind.filter.frequency.setTargetAtTime(300 + Math.sin(now * 0.13) * 180 + Math.sin(now * 0.31) * 90 + (weather === 'snow' ? -120 : 0), now, 1)
  audio.hum.gain.gain.setTargetAtTime(mode === 2 ? 0.25 : mode === 3 ? 0.35 : mode === 1 ? 0.12 : 0, now, 2)
  audio.hum.filter.frequency.setTargetAtTime(mode === 3 ? 260 : 140, now, 2)
  if (flash > 0.5 && now - audio.lastFlash > 2 && !comfort.on) { audio.lastFlash = now; thunder() }
  updateComfort()
  if (now > audio.nextBird) {
    if ((mode === 0 || mode === 4) && night < 0.4 && !wet) chirp()
    audio.nextBird = now + 2 + Math.random() * 6
  }
  if (now > audio.nextCritter) {
    if ((mode === 0 || mode === 4) && night > 0.6 && !wet) { crickets(); if (Math.random() < 0.08) hoot() }
    audio.nextCritter = now + 0.6 + Math.random() * 1.8
  }
  if (now > audio.nextDrip) {
    if (mode === 1 || weather === 'drips') drip()
    if (mode === 3) drip(true)
    if (wet && Math.random() < 0.5) drip()
    audio.nextDrip = now + 0.4 + Math.random() * (mode === 1 ? 2.5 : 1.2)
  }
}

// ---------- tinnitus comfort: a soft sound bed, no sharp highs, and an optional notch at the user's own tone ----------
const comfort = (() => {
  try { return Object.assign({ on: false, level: 0.35, freq: 0 }, JSON.parse(localStorage.getItem('foxtrail-comfort') || '{}')) } catch { return { on: false, level: 0.35, freq: 0 } }
})()
function saveComfort() { try { localStorage.setItem('foxtrail-comfort', JSON.stringify(comfort)) } catch {} }

/** Builds the comfort chain once the audio exists: a notch pair and a high shelf on the master, and the surf bed. */
function setupComfort() {
  const ctx = audio.ctx
  if (!ctx || audio.comfort) return
  const notchA = ctx.createBiquadFilter()
  notchA.type = 'notch'
  notchA.Q.value = 0.9
  const notchB = ctx.createBiquadFilter()
  notchB.type = 'notch'
  notchB.Q.value = 1.6
  const shelf = ctx.createBiquadFilter()
  shelf.type = 'highshelf'
  shelf.frequency.value = 5000
  shelf.gain.value = 0
  // reroute: master -> notches -> shelf -> compressor
  audio.master.disconnect()
  const comp = ctx.createDynamicsCompressor()
  comp.threshold.value = -18
  comp.ratio.value = 3
  audio.master.connect(notchA).connect(notchB).connect(shelf).connect(comp).connect(ctx.destination)
  const bed = loopNoise(true)
  const pink = loopNoise(false)
  const pinkLp = ctx.createBiquadFilter()
  pinkLp.type = 'lowpass'
  pinkLp.frequency.value = 2600
  const pinkGain = ctx.createGain()
  pinkGain.gain.value = 0.12
  pink.connect(pinkLp).connect(pinkGain)
  const bedLp = ctx.createBiquadFilter()
  bedLp.type = 'lowpass'
  bedLp.frequency.value = 3400
  const bedGain = ctx.createGain()
  bedGain.gain.value = 0
  bed.connect(bedLp)
  pinkGain.connect(bedLp)
  bedLp.connect(bedGain).connect(audio.master)
  audio.comfort = { notchA, notchB, shelf, bedGain }
  applyComfort()
}

function applyComfort() {
  if (!audio.comfort) return
  const c = audio.comfort
  const now = audio.ctx.currentTime
  const f = comfort.on && comfort.freq ? comfort.freq : 0
  for (const n of [c.notchA, c.notchB]) {
    n.frequency.setTargetAtTime(f || 20000, now, 0.3)
    n.Q.setTargetAtTime(f ? n.Q.value : 30, now, 0.3)
  }
  c.shelf.gain.setTargetAtTime(comfort.on ? -10 : 0, now, 0.5)
}

/** The surf: the bed swells and settles on a slow breath, about ten seconds a wave. */
function updateComfort() {
  if (!audio.comfort || !audio.ctx) return
  const now = audio.ctx.currentTime
  const wave = 0.75 + 0.25 * Math.sin((now / 10) * Math.PI * 2) + 0.06 * Math.sin((now / 3.7) * Math.PI * 2)
  audio.comfort.bedGain.gain.setTargetAtTime(comfort.on ? comfort.level * wave * 0.6 : 0, now, 0.8)
}

function mixAt(x) {
