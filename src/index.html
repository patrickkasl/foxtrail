  const sunCol = cur.sun.clone().lerp(hex('#ffb070'), dusk * 0.8).lerp(hex('#7f93d8'), night).multiplyScalar(lerp(1, 0.35, night))
  const arc = timed ? ((h - 6) / 14) * Math.PI : 0.9
  const sunDir = timed && night > 0.6 ? new THREE.Vector3(0.35, 0.55, -0.75) : new THREE.Vector3(Math.cos(arc) * 0.8, Math.max(0.12, Math.sin(arc)) * 0.8, -0.6)
  sunDir.normalize()
  const U = uniforms
  U.uTop.value.copy(top); U.uLow.value.copy(low); U.uFog.value.copy(fog); U.uSunCol.value.copy(sunCol); U.uSun.value.copy(sunDir)
  U.uGrass.value.copy(cur.grass); U.uRock.value.copy(cur.rock); U.uGlow.value.copy(cur.glow); U.uWaterCol.value.copy(cur.waterCol); U.uPlanet.value.copy(cur.planet)
  U.uSnow.value = lerp(m.a.snow, m.b.snow, m.k)
  U.uAmp.value = lerp(m.a.amp, m.b.amp, m.k)
  U.uWater.value = lerp(m.a.water, m.b.water, m.k)
  U.uDensity.value = lerp(m.a.density, m.b.density, m.k)
  U.uRidge.value = lerp(m.a.ridge, m.b.ridge, m.k)
  U.uFreq.value = lerp(m.a.freq, m.b.freq, m.k)
  U.uMode.value = b.mode
  U.uNight.value = night
  U.uRing.value = b.ring || 0
  U.uNebula.value = b.nebula || 0
  const dark = Math.max(night, b.mode === 1 ? 1 : 0, b.mode === 2 ? 0.5 : 0, b.mode === 3 ? 0.4 : 0)
  U.uLantern.value = lerp(U.uLantern.value, dark > 0.45 ? 1 : 0, 0.04)
  fox.userData.lamp.material.emissiveIntensity = U.uLantern.value * 2.5
  lanternLight.intensity = U.uLantern.value * 3
  lanternLight.position.set(fox.position.x - 0.2, fox.position.y + 1.1, 0.5)
  U.uFox.value.set(fox.position.x - 0.2, fox.position.y + 1.0, 0.3)
  sunLight.color.setRGB(sunCol.x, sunCol.y, sunCol.z)
  sunLight.intensity = b.mode === 1 ? 0.4 : 2.4
  sunLight.position.copy(fox.position).addScaledVector(sunDir, 20)
  sunLight.target.position.copy(fox.position)
  rim.color.setRGB(Math.min(1, sunCol.x * 1.2), Math.min(1, sunCol.y * 1.1), sunCol.z)
  rim.position.set(fox.position.x - 4, fox.position.y + 3, -6)
  rim.target.position.copy(fox.position)
  hemi.color.setRGB(top.x * 0.6 + 0.4, top.y * 0.6 + 0.4, top.z * 0.6 + 0.4)
  hemi.groundColor.setRGB(cur.grass.x, cur.grass.y, cur.grass.z)
  hemi.intensity = (b.mode === 1 ? 0.25 : lerp(1.0, 0.35, night)) * (1 - uniforms.uCloud.value * 0.3)
  sunLight.intensity *= 1 - uniforms.uCloud.value * 0.7
  return { b, night }
}

let state = 'walk'
const JUMP_TIME = (DEBUG && Number(new URLSearchParams(location.search).get('jt'))) || 0.9
const JUMP_HEIGHT = 0.55
function startJump(m, t) { if (t > m.jumpUntil + 0.3) m.jumpUntil = t + JUMP_TIME }
function packJump() { for (const m of members.values()) startJump(m, clock.elapsedTime + Math.random() * 0.3) }
debug.sit = () => { state = 'sit'; stateSince = clock.elapsedTime + 1e5 }
addEventListener('keydown', ev => {
  if (ev.code === 'Space') { ev.preventDefault(); packJump() }
  if (ev.key === 'z' || ev.key === 'Z') {
    if (state === 'sit') { state = 'walk'; stateSince = clock.elapsedTime; nextLook = 70 + Math.random() * 90 }
    else { state = 'sit'; stateSince = clock.elapsedTime + 1e5 }
  }
})
let stateSince = 0
let nextLook = 50 + Math.random() * 60
let speed = 1.2
let zoom = 0
let lastSeg = null
const clock = new THREE.Clock()
const camPos = new THREE.Vector3(fox.position.x + 2.5, groundY(fox.position.x) + 2.6, 9)

function showTitle(seg) {
  const el = document.getElementById('title')
  el.innerHTML = `${seg.biome.name}<small>${SUBS[seg.biome.realm]}</small>`
  el.style.opacity = 1
  clearTimeout(showTitle.t)
  showTitle.t = setTimeout(() => (el.style.opacity = 0), 5200)
}

/** Distance between foxes: a little closer as the pack grows. */
function packSpacing() { return Math.max(1.15, 1.7 - Math.max(0, ordered().length - 2) * 0.1) }

/** The pack's order: who joined first walks in front. */
function ordered() {
  return [...members.values()].filter(m => !m.leftAt).sort((a, b) => (a.info.startedAt || 0) - (b.info.startedAt || 0))
}

function animatePack(t, dt) {
  const list = ordered()
  list.forEach((m, slot) => (m.slot = slot))
  for (const m of [...members.values()]) {
    const g = m.group
    if (m.queue[0] === 'jump') { m.queue.shift(); startJump(m, t) }
    else if (m.queue[0] === 'cairn' && m.mode === 'walk' && t > m.jumpUntil) { m.queue.shift(); m.mode = 'cairn'; m.modeSince = t; m.placed = false }
    if (m.mode === 'cairn') {
      if (t - m.modeSince > 1.2 && !m.placed) { const c = placeCairn(g.position.x + 0.8, t); c.userData.commit = { text: 'A commit', project: m.info.project || 'Claude', coat: (COATS[m.coat] || COATS[0]).name, at: Date.now() }; cairnsToday++; m.placed = true }
      if (t - m.modeSince > 3) m.mode = 'walk'
    }
    let target = g.position.x
    if (!m.leftAt) {
      target = fox.position.x - m.slot * packSpacing() + Math.sin(t * 0.3 + m.slot) * 0.25
      const pull = (target - g.position.x) * 1.2
      const want = m.mode === 'cairn' ? 0 : clamp((state === 'walk' ? speed : 0) + pull, 0, 4.6)
      m.v = lerp(m.v, want, 1 - Math.exp(-dt * 4))
    } else m.v = lerp(m.v, 0, 1 - Math.exp(-dt * 3))
    if (state === 'walk' && m.mode === 'walk' && !m.leftAt) { m.nextHop -= dt; if (m.nextHop < 0) { startJump(m, t); m.nextHop = 40 + Math.random() * 90 } }
    const ob = obstacleAhead(g.position.x - 0.3)
    if (ob && ob !== m.cleared) {
      const lead = Math.max(0.35, m.v * JUMP_TIME * 0.5) + 0.25
      if (ob.x - g.position.x < lead && m.v > 0.3) { m.jumpUntil = t + JUMP_TIME; m.cleared = ob }
      else if (ob.x - g.position.x < 1.2 && m.v <= 0.3 && !m.leftAt) m.v = Math.max(m.v, 0)
    }
    if (!debug.hold) g.position.x += m.v * dt
    const x = g.position.x
    g.position.z = lerp(g.position.z, m.slot % 2 ? 0.45 : -0.35, 0.03) * (m.slot ? 1 : 0)
    m.baseY = lerp(m.baseY, groundY(x), 0.3)
    const slope = (groundY(x + 0.4) - groundY(x - 0.4)) / 0.8
    const moving = m.v > 0.12
    g.rotation.z = lerp(g.rotation.z, moving ? Math.atan(slope) * 0.7 : 0, 0.08)
    const jumping = t < m.jumpUntil
    let lift = 0
    if (m.real.model) {
      if (moving || jumping) {
        const run = m.v > 2.0
        playFox(m, run ? 'Run' : 'Walk')
        m.real.current.timeScale = run ? m.v / 3.0 : Math.max(0.3, m.v / 1.15)
      } else {
        playFox(m, 'Survey', 0.8)
        m.real.current.timeScale = 0.6
      }
      m.real.mixer.update(dt)
      g.position.y = m.baseY
      m.sit = lerp(m.sit, state === 'sit' && !moving && !jumping && !m.leftAt ? 1 : 0, 1 - Math.exp(-dt * 3))
      const jp = jumping ? clamp((t - (m.jumpUntil - JUMP_TIME)) / JUMP_TIME) : 0
      applyPose(m, 'sit', m.sit)
      applyPose(m, 'jump', jumping ? Math.sin(jp * Math.PI) ** 0.6 : 0)
      g.updateMatrixWorld(true)
      lift = jumping ? Math.sin(jp * Math.PI) * JUMP_HEIGHT : 0
      m.drop = lerp(m.drop, m.sit > 0.05 ? -pawClearance(m) : 0, 0.25)
      g.position.y = m.baseY + m.drop * m.sit + lift
    } else {
      const u = m.fallback.userData
      const phase = t * m.v * 5.4
      u.legs.forEach((l, i) => (l.rotation.z = moving ? Math.sin(phase + (i % 2) * Math.PI + (i > 1 ? Math.PI : 0)) * 0.55 : 0))
      g.position.y = m.baseY
    }
    m.blob.position.set(x, groundY(x) + 0.02, g.position.z)
    m.blob.visible = !!m.real.model || foxFailed
    m.blob.scale.set(1.05 * (1 - lift * 0.3), 0.28 * (1 - lift * 0.3), 1)
    if (m.leftAt && (t - m.leftAt > 30 || x < camera.position.x - 16)) removeMember(m)
  }
}

/** The project name, numbered when two sessions share it. */
function displayName(m) {
  const name = m.info.project || 'Claude'
  const same = ordered().filter(x => (x.info.project || 'Claude') === name)
  return same.length > 1 ? `${name} ${same.indexOf(m) + 1}` : name
}

/** Name tags above the foxes: the project in the title face, a quiet icon, and a hairline down to the fox's head. */
const _lp = new THREE.Vector3()
const _hp = new THREE.Vector3()
function headPoint(m, target) {
  const head = m.real.bones && m.real.bones.b_Head_05
  if (head) return head.getWorldPosition(target).add(_v1.set(0, 0.32, 0))
  return target.set(m.group.position.x + 0.45, m.group.position.y + 1.05, m.group.position.z)
}
function updateLabels() {
  const shown = []
  for (const m of members.values()) {
    headPoint(m, _lp).project(camera)
    const act = steadyActivity(m, clock.elapsedTime)
    const visible = _lp.z < 1 && !m.leftAt && !prefs.still
    m.label.style.display = visible ? 'flex' : 'none'
    if (!visible) continue
    const html = `<div class="tag"><span class="ic ${act === 'rest' ? 'rest' : ''}" title="${ACT_WORDS[act]}">${ICONS[act]}</span><span>${displayName(m)}</span></div><i class="stem"></i>`
    if (m.labelHtml !== html) { m.label.innerHTML = html; m.labelHtml = html; m.labelWidth = 0 }
    if (!m.labelWidth) m.labelWidth = m.label.firstElementChild.offsetWidth || 80
    shown.push({ m, x: ((_lp.x + 1) / 2) * innerWidth, y: ((1 - _lp.y) / 2) * innerHeight })
  }
  // names that would touch go up a row, with a longer hairline
  shown.sort((a, b) => a.x - b.x)
  const rowEnds = []
  for (const s of shown) {
    const half = s.m.labelWidth / 2 + 8
    let row = 0
    while (rowEnds[row] !== undefined && rowEnds[row] > s.x - half) row++
    rowEnds[row] = s.x + half
    s.m.labelRow = lerp(s.m.labelRow ?? row, row, 0.15)
    const stemNow = 14 + s.m.labelRow * 24
    s.m.label.lastElementChild.style.height = `${stemNow}px`
    s.m.label.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -100%)`
    s.m.labelTop = s.y - stemNow - 22
  }
}

/** A fox cub for a subagent: the same model, small, with its own fur tint and animations. */
function makeCub(seed, coat = 0) {
  if (!foxAsset) return null
  const g = new THREE.Group()
  const model = SkeletonUtils.clone(foxAsset.scene)
  const box = new THREE.Box3().setFromObject(model)
  const size = box.getSize(new THREE.Vector3())
  model.scale.setScalar(0.7 / Math.max(size.x, size.z))
  if (size.z > size.x) model.rotation.y = Math.PI / 2
  dressFox(model, coat, 0.06)
  g.add(model)
  const mixer = new THREE.AnimationMixer(model)
  const actions = {}
  for (const clip of foxAsset.animations) actions[clip.name] = mixer.clipAction(clip)
  g.userData = { cub: true, mixer, actions, current: null }
  return g
}

function updateCompanions(t, dt) {
  const live = new Map()
  for (const m of members.values()) for (const a of m.info.agents || []) live.set(a.id, { a, owner: m })
  for (const [id, { a, owner }] of live) {
    if (companions.has(id) || !foxAsset) continue
    const seedN = id.split('').reduce((h, c) => h * 31 + c.charCodeAt(0), 7)
    const g = makeCub(seedN, owner.coat)
    const x0 = owner.group.position.x - 9
    g.position.set(x0, groundY(x0), 0.5)
    g.userData.kind = 'cub'
    scene.add(g)
    companions.set(id, g)
  }
  const perOwner = new Map()
  for (const [id, g] of companions) {
    const entry = live.get(id)
    const leaving = !entry
    if (entry) { g.userData.agent = entry.a; g.userData.owner = entry.owner }
    if (leaving && !g.userData.leftAt) g.userData.leftAt = t
    const owner = g.userData.owner
    const n = leaving ? 0 : (perOwner.get(owner) || 0) + 1
    if (!leaving) perOwner.set(owner, n)
    const ox = owner && members.has(owner.id) ? owner.group.position.x : g.position.x
    const targetX = leaving ? g.position.x : ox - 0.75 - n * 0.6
    g.position.x = lerp(g.position.x, targetX, 0.06)
    g.position.z = lerp(g.position.z, (owner && members.has(owner.id) ? owner.group.position.z : 0) + (n % 2 ? 0.5 : -0.45), 0.05)
    const moving = state === 'walk'
    let y = groundY(g.position.x)
    {
      const v = Math.abs(targetX - g.position.x) * 3 + (moving ? speed : 0)
      const act = v > 2.4 ? 'Run' : v > 0.25 ? 'Walk' : 'Survey'
      const next = g.userData.actions[act]
      if (next && g.userData.current !== next) { next.reset().fadeIn(0.4).play(); if (g.userData.current) g.userData.current.fadeOut(0.4); g.userData.current = next }
      if (g.userData.current) g.userData.current.timeScale = act === 'Survey' ? 0.6 : act === 'Run' ? v / 2.4 : Math.max(0.5, v / 0.9)
      g.userData.mixer.update(dt)
      if (moving && Math.sin(t * 1.7 + n * 2) > 0.985) g.userData.hopUntil = t + 0.5
      const cob = obstacleAhead(g.position.x - 0.2)
      if (cob && cob !== g.userData.cleared && cob.x - g.position.x < 0.45) { g.userData.hopUntil = t + 0.5; g.userData.cleared = cob }
      if (t < (g.userData.hopUntil || 0)) y += Math.sin((g.userData.hopUntil - t) / 0.5 * Math.PI) * 0.45
    }
    g.position.y = y
    if (leaving) {
      g.scale.setScalar(Math.max(0.001, 1 - (t - g.userData.leftAt) / 1.5))
      if (t - g.userData.leftAt > 1.5) { scene.remove(g); companions.delete(id) }
    }
  }
}

const ray = new THREE.Raycaster()
const card = document.getElementById('card')
const TOOL_WORDS = { Bash: 'runs a command', Read: 'reads a file', Edit: 'edits code', Write: 'writes a file', Grep: 'searches the code', Glob: 'looks for files', Agent: 'sends out a cub', WebFetch: 'reads the web', WebSearch: 'searches the web' }
const since = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? `${s} s` : `${Math.round(s / 60)} min` }
renderer.domElement.addEventListener('click', ev => {
  ray.setFromCamera(new THREE.Vector2((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1), camera)
  const foxes = [...members.values()].map(m => m.group)
  const targets = [...foxes, ...companions.values(), ...cairns]
  const hit = ray.intersectObjects(targets, true)[0]
  if (!hit) { card.style.display = 'none'; return }
  let o = hit.object
  while (o.parent && !targets.includes(o)) o = o.parent
  const m = [...members.values()].find(x => x.group === o)
  if (o.userData.commit) {
    const c = o.userData.commit
    const esc = v => String(v).replace(/[<>&]/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch]))
    card.innerHTML = `<b>${esc(c.text)}</b><span>${esc(c.coat)}, ${esc(c.project)} · ${new Date(c.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</span>`
  } else if (m) {
    const i = m.info
    const what = ACT_WORDS[m.shownAct || actOf(i.tool)]
    const helpers = (i.agents || []).length
    card.innerHTML = `<b>${displayName(m)}</b><span>${(COATS[m.coat] || COATS[0]).name}</span><br>${m.leftAt ? 'This session has ended.' : state === 'sit' ? 'Enjoying the view.' : 'On the trail.'}<br><span>Now:</span> ${what}<br><span>Cubs:</span> ${helpers}<br><span>Commits today:</span> ${Math.max(0, i.commitsToday || 0)}`
  } else {
    const a = o.userData.agent
    const owner = o.userData.owner
    card.innerHTML = `<b>${o.userData.kind[0].toUpperCase() + o.userData.kind.slice(1)}</b>${errand(a.type)[0].toUpperCase() + errand(a.type).slice(1)}<br><span>With:</span> ${owner ? owner.info.project : '?'}<br><span>Out for:</span> ${since(a.startedAt || Date.now())}`
  }
  card.style.display = 'block'
  card.style.left = Math.min(innerWidth - 280, ev.clientX + 14) + 'px'
  card.style.top = Math.max(10, ev.clientY - 90) + 'px'
  clearTimeout(card.t)
  card.t = setTimeout(() => (card.style.display = 'none'), 6000)
})
addEventListener('wheel', ev => { zoom = clamp(zoom + ev.deltaY * 0.003, -0.4, 1.5) }, { passive: true })

let saveTimer = 0
const FRAME_MS = 1000 / 30
let lastFrameAt = 0
let slowFor = 0
let fastFor = 0
let perf = { ms: 0, shown: false }
const perfEl = document.createElement('div')
perfEl.style.cssText = 'position:fixed;right:18px;top:14px;font:12px Inter,sans-serif;opacity:.75;display:none;text-shadow:0 1px 8px rgba(0,0,0,.5)'
document.body.appendChild(perfEl)
addEventListener('keydown', ev => { if (ev.key === 'p' || ev.key === 'P') { perf.shown = !perf.shown; perfEl.style.display = perf.shown ? 'block' : 'none' } })

/** Keeps the landscape near 30 frames a second: lower resolution when the GPU falls behind, higher when it has room. */
function adaptResolution(interval) {
  perf.ms = lerp(perf.ms || interval, interval, 0.05)
  if (perf.ms > FRAME_MS * 1.35) { slowFor++; fastFor = 0 } else if (perf.ms < FRAME_MS * 1.08) { fastFor++; slowFor = 0 } else { slowFor = 0; fastFor = 0 }
  const before = LAND_SCALE
  if (slowFor > 45 && LAND_SCALE > 0.3) { LAND_SCALE = Math.max(0.3, LAND_SCALE - 0.05); slowFor = 0 }
  if (fastFor > 240 && LAND_SCALE < 0.6) { LAND_SCALE = Math.min(0.6, LAND_SCALE + 0.05); fastFor = 0 }
  if (before !== LAND_SCALE) resize()
  if (perf.shown) perfEl.textContent = `${(1000 / perf.ms).toFixed(0)} beelden/s · landschap ${Math.round(LAND_SCALE * 100)}% · ${landTarget.width}×${landTarget.height}`
}

function frame(now = performance.now()) {
  requestAnimationFrame(frame)
  if (now - lastFrameAt < FRAME_MS - 2) return
  const interval = lastFrameAt ? now - lastFrameAt : FRAME_MS
  lastFrameAt = now
  adaptResolution(interval)
  const dt = Math.min(0.08, clock.getDelta())
  const t = clock.elapsedTime
  const connected = Date.now() - link.at < 5000
  document.getElementById('offline').style.opacity = connected || t < 4 ? 0 : 0.7
  if (!connected && !members.size && t > 3) addMember('solo', { project: 'Claude', startedAt: 0 }, fox.position.x)
  const infos = [...members.values()].filter(m => !m.leftAt).map(m => m.info)
  const busy = connected ? Math.max(0, ...infos.map(i => clamp(i.busy || 0))) : 0.35
  const idle = connected && busy < 0.05
  noticeRest(connected && !idle, t)

  if (state === 'walk') {
    speed = lerp(speed, lerp(0.9, 2.2, busy), 0.02)
    if (!debug.hold) fox.position.x += speed * dt
    nextLook -= dt
    if ((idle && t - stateSince > 6) || nextLook < 0) { state = 'sit'; stateSince = t }
  } else if (state === 'sit') {
    if (!idle && t - stateSince > 9) { state = 'walk'; stateSince = t; nextLook = 70 + Math.random() * 90 }
    if (!connected && t - stateSince > 12) { state = 'walk'; stateSince = t; nextLook = 60 + Math.random() * 60 }
  }

  updateTour(t)
  const seg = segmentAt(fox.position.x)
  if (seg !== lastSeg) { if (lastSeg) showTitle(seg); else setTimeout(() => showTitle(seg), prefs.welcomed ? 9500 : 600); lastSeg = seg }
  ensurePortals(fox.position.x)
  ensureObstacles(fox.position.x)
  const { b: here, night } = applyAtmosphere(fox.position.x)
  const weatherNow = updateWeather(t, dt, here, night)
  if (zoo) updateZoo(t, dt)
  else updateFauna(t, dt, here, night, weatherNow)
  updateAudio(here, night, weatherNow, busy, here.amp || 0.6, uniforms.uFlash.value)
  animatePack(t, dt)
  updateCompanions(t, dt)
  for (const c of cairns) { const age = t - c.userData.born; c.scale.setScalar(age < 0.6 ? Math.max(0.01, age / 0.6) : 1); c.userData.flag.rotation.y = Math.sin(t * 3 + c.position.x) * 0.3 }
  for (const p of portals.values()) p.children[0].rotation.z = t * 0.4

  const packSize = Math.max(1, ordered().length)
  const extent = (packSize - 1) * packSpacing() + 3.2
  const focusX = fox.position.x - (packSize - 1) * packSpacing() / 2
  const wide = clamp((state === 'sit' ? 1 : 0) + zoom)
  const fit = (extent / 2) / (TAN * camera.aspect) * 1.25
  const camZ = Math.max(lerp(9, 13, wide) + Math.min(0, zoom) * 4, fit)
  const target = new THREE.Vector3(focusX + lerp(packSize > 1 ? 0.6 : 2.4, packSize > 1 ? 1.4 : 3.6, wide), groundY(focusX) + lerp(1.9, 2.8, wide) + (camZ - 9) * 0.12, camZ)
  camPos.lerp(target, 0.03)
  camera.position.copy(camPos)
  camera.lookAt(camPos.clone().add(FWD))
  uniforms.uCam.value.copy(camPos)
  uniforms.uTime.value = t

  const doing = []
  document.getElementById('hud').textContent = `${packSize > 1 ? `pack of ${packSize} · ` : ''}${(fox.position.x / 1000).toFixed(2)} km today · ${cairnsToday} ${cairnsToday === 1 ? 'cairn' : 'cairns'}${companions.size ? ` · ${companions.size} ${companions.size === 1 ? 'cub' : 'cubs'}` : ''}${WEATHER_WORDS[weatherNow] ? ` · ${WEATHER_WORDS[weatherNow]}` : ''}`
  document.getElementById('doing').textContent = doing.join(' · ')
  updateLabels()
  updateBubbles(t)

  saveTimer += dt
  if (saveTimer > 5) { saveTimer = 0; try { localStorage.setItem('foxtrail', JSON.stringify({ day: today, x: fox.position.x, cairns: cairnsToday })) } catch {} }

  renderer.setRenderTarget(landTarget)
  renderer.render(landScene, landCam)
  renderer.setRenderTarget(null)
  renderer.clear()
  renderer.render(blitScene, landCam)
  renderer.clearDepth()
  const t1 = debug.measure ? performance.now() : 0
  renderer.render(scene, camera)
  if (debug.measure) {
    renderer.getContext().finish()
    const m = debug.measure
    m.scene = (m.scene || 0) * 0.95 + (performance.now() - t1) * 0.05
    m.frame = (m.frame || 0) * 0.95 + (performance.now() - now) * 0.05
    m.calls = renderer.info.render.calls
    m.triangles = renderer.info.render.triangles
  }
}
debug.bench = (n = 10, scale) => {
  const px = new Uint8Array(4)
  const old = [landTarget.width, landTarget.height]
  if (scale) landTarget.setSize(Math.round(innerWidth * scale), Math.round(innerHeight * scale))
  renderer.setRenderTarget(landTarget)
  renderer.render(landScene, landCam)
  renderer.readRenderTargetPixels(landTarget, 0, 0, 1, 1, px)
  const t0 = performance.now()
  for (let i = 0; i < n; i++) { renderer.render(landScene, landCam); renderer.readRenderTargetPixels(landTarget, 0, 0, 1, 1, px) }
  const ms = (performance.now() - t0) / n
  const size = [landTarget.width, landTarget.height]
  landTarget.setSize(...old)
  renderer.setRenderTarget(null)
  return { msPerLandscape: +ms.toFixed(1), size }
}

// ---------- the tour (debug only, ?debug&tour): every kind of world with its animals, music and weather ----------
const TOUR = [
  { mode: 0, hour: 10, text: 'Meadow by day: deer led by a stag, birds passing over', spawn: cx => { spawnGrazers(cx - 26, 'deer'); spawnFlock(cx) } },
  { mode: 0, hour: 21.5, weather: 'aurora', text: 'Meadow at night: wolves under the aurora', spawn: cx => { spawnGrazers(cx - 26, 'wolf'); spawnGrazers(cx - 14, 'wolf') } },
  { mode: 1, hour: 12, text: 'Caves: a colony of bats', spawn: cx => { spawnSwarm(cx, 'bat', 8, { z: -3.5, y: 1.8, speed: 2.2, spread: [5, 1.4, 2.5], enter: 12 }) } },
  { mode: 3, hour: 12, text: 'Under water: a school of fish, dolphins, a manta and a whale', spawn: cx => {
    spawnSwarm(cx, 'fish', 14, { z: -6, y: 2.5, speed: 1.2, spread: [4, 1.6, 2.5], enter: 12 })
    for (let i = 0; i < 3; i++) spawnCruiser(cx + i * 2.5, 'dolphin', { z: -12, y: 3, speed: 2.4, enter: 20 })
    spawnCruiser(cx, 'manta', { z: -18, y: 5, speed: 1.4, enter: 22 })
    spawnCruiser(cx, 'whale', { z: -38, y: 8, speed: 1.2, enter: 40 })
  } },
  { mode: 4, hour: 11, text: 'Fantasy lands: wandering spirits and a dragon', spawn: cx => {
    spawnSwarm(cx, 'ghost', 4, { z: -6, y: 1.8, speed: 0.6, spread: [6, 1.2, 3], enter: 8 })
    spawnCruiser(cx, 'dragon', { z: -26, y: 10, speed: 3, enter: 35 })
  } },
  { mode: 2, hour: 23, text: 'The space between: stars, planets and the quietest music', spawn: () => {} },
]
const tour = DEBUG && new URLSearchParams(location.search).has('tour') ? { stop: (Number(new URLSearchParams(location.search).get('tour')) || 0) - 1, next: 3, spawnAt: 0 } : null
let tourEl = null
function findMode(mode) {
  let x = fox.position.x + 60
  for (let i = 0; i < 400; i++) {
    const seg = segmentAt(x)
    if (seg.biome.mode === mode) return seg.start + BLEND + 10
    x = seg.end + 1
  }
  return null
}
function updateTour(t) {
  if (!tour) return
  state = 'walk'
  stateSince = t
  nextLook = 1e9
  if (t > tour.next) {
    tour.stop = (tour.stop + 1) % TOUR.length
    const stop = TOUR[tour.stop]
    const x = findMode(stop.mode)
    if (x !== null) {
      debug.teleport(x)
      camPos.x += x - camera.position.x
      camera.position.x = x
      const seg = segmentAt(x)
      weather.realm = seg.biome.realm + seg.biome.name
    }
    for (const m of members.values()) enterFromLeft(m)
    debugHour = stop.hour
    weather.next = stop.weather || 'clear'; weather.mix = 0; weather.until = t + 600
    tour.spawnAt = t + 2
    tour.next = t + 32
    tourEl ||= Object.assign(document.body.appendChild(document.createElement('div')), { style: 'position:fixed;left:50%;bottom:70px;transform:translateX(-50%);font:italic 22px Cormorant Garamond,serif;color:#fff;text-shadow:0 1px 8px #0008;pointer-events:none;transition:opacity 1s' })
    tourEl.textContent = stop.text
  }
  if (tour.spawnAt && t > tour.spawnAt) { tour.spawnAt = 0; TOUR[tour.stop].spawn(camera.position.x) }
}

Object.assign(debug, {
  uniforms, audio,
  obstacles: () => obstacles.map(o => Math.round(o.x * 10) / 10),
  weather: kind => { weather.next = kind; weather.mix = 0; weather.until = clock.elapsedTime + 600 },
  route: () => route.map(r => [Math.round(r.start), r.biome.name]),
  /** How fast a planted leg moves back under the body in a clip: the ground speed at which it does not slide. */
  stride: (kind, clip, bone = 'FrontLowerLegL') => {
    const a = makeAnimal(kind)
    const act = a.userData.actions[clip]
    a.userData.mixer.stopAllAction()
    act.reset().play()
    const b = a.getObjectByName(bone)
    const dur = act.getClip().duration, steps = 240, pts = []
    for (let i = 0; i <= steps; i++) { a.userData.mixer.setTime(dur * i / steps); a.updateMatrixWorld(true); const p = b.getWorldPosition(new THREE.Vector3()); pts.push([p.x, p.y]) }
    const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys)
    const v = []
    for (let i = 1; i < pts.length; i++) if (pts[i][1] < lo + (hi - lo) * 0.15) v.push((pts[i - 1][0] - pts[i][0]) / (dur / steps))
    return { duration: +dur.toFixed(2), speed: +(v.reduce((x, y) => x + y, 0) / v.length).toFixed(3), samples: v.length }
  },
  fauna: () => fauna.map(g => [g.userData.type, g.userData.kind, ...g.position.toArray().map(v => Math.round(v * 10) / 10)]),
  teleport: x => { fox.position.x = x; for (const m of members.values()) m.group.position.x = x - (m.slot || 0) * 1.6 },
  music: () => audio.area && { mode: audio.area.mode, lead: audio.area.lead, root: audio.area.root, arp: audio.area.arp, motif: audio.area.motif.length, pending: !!audio.pending },
})
requestAnimationFrame(frame)
